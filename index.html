<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BASE DE DATOS 2 - Kevin Macha</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #050505;
      --panel: rgba(20, 20, 20, 0.85);
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.4);
      --text: #e9efe8;
      --border: rgba(0, 255, 136, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Poppins", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER RECONSTRUIDO PARA QUE LOS CLICS FUNCIONEN */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-left, .header-right { flex: 1; display: flex; }
    .header-right { justify-content: flex-end; }

    .header-left img { height: 55px; border-radius: 5px; filter: drop-shadow(0 0 5px var(--accent)); }

    .header-center { text-align: center; flex: 2; }
    .header-center h1 {
      font-size: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-glow);
      color: #fff;
    }
    .uni { font-size: 11px; color: #888; }
    .name { font-size: 13px; color: var(--accent); font-weight: 600; }

    /* BOTONES DEL MENÚ */
    nav.header-nav { display: flex; gap: 10px; }
    nav.header-nav a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer !important;
      transition: 0.3s;
      border: 1px solid transparent;
      background: transparent;
    }
    nav.header-nav a:hover {
      background: rgba(0, 255, 136, 0.1);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* CONTENIDO */
    main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.4s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .panel {
      background: var(--panel);
      border-radius: 15px;
      padding: 25px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .tasks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
    .task-card {
      background: rgba(255,255,255,0.03);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: 0.3s;
    }
    .task-card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(0,255,136,0.05); }
    .task-icon i { font-size: 1.8rem; color: var(--accent); margin-bottom: 10px; }

    input { width: 100%; max-width: 300px; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; }
    button { padding: 10px 20px; background: var(--accent); border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    
    .file-list a { display: block; padding: 10px; background: rgba(255,255,255,0.05); margin-bottom: 5px; border-radius: 5px; color: #ccc; text-decoration: none; border-left: 3px solid var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="upla.PNG" alt="Logo">
  </div>
  
  <div class="header-center">
    <h1>Base de Datos 2</h1>
    <div class="uni">Universidad Peruana Los Andes</div>
    <div class="name">Kevin Alfredo Macha Bruno</div>
  </div>

  <div class="header-right">
    <nav class="header-nav">
      <a onclick="showSection('inicio')">Inicio</a>
      <a onclick="showSection('tareas')">Tareas</a>
      <a onclick="showSection('login')">Login</a>
    </nav>
  </div>
</header>

<main>
  <section id="inicio" class="section active">
    <div class="panel">
      <h2><i class="fas fa-home"></i> Bienvenido</h2>
      <p style="margin-top:10px;">Portal de actividades académicas de Kevin Macha.</p>
    </div>
  </section>

  <section id="tareas" class="section">
    <div class="panel">
      <h2><i class="fas fa-folder"></i> Unidades</h2>
      <div class="tasks-grid" id="units"></div>
    </div>
  </section>

  <section id="weeks-view" class="section">
    <div class="panel">
      <h2 id="unit-title"></h2>
      <div class="tasks-grid" id="weeks"></div>
      <button onclick="showSection('tareas')" style="margin-top:20px; background:transparent; border:1px solid var(--accent); color:var(--accent)">Volver</button>
    </div>
  </section>

  <section id="semana-view" class="section">
    <div class="panel">
      <h2 id="semana-title"></h2>
      <div id="file-container" class="file-list"></div>
      <div style="margin-top:20px;">
        <a id="repo-link" target="_blank"><button>GitHub</button></a>
        <button onclick="showSection('weeks-view')" style="background:transparent; border:1px solid #555; color:#fff">Atrás</button>
      </div>
    </div>
  </section>

  <section id="login" class="section">
    <div class="panel" style="max-width:350px; margin:0 auto; text-align:center;">
      <h2>Login</h2>
      <input id="user" placeholder="Usuario">
      <input id="pass" type="password" placeholder="Contraseña">
      <button onclick="login()" style="width:100%">Entrar</button>
      <p id="login-msg" style="margin-top:10px;"></p>
    </div>
  </section>
</main>

<script>
  const repoUser = "KEVIN43287";
  const repoName = "Actividades";

  // FUNCIÓN DE NAVEGACIÓN CORREGIDA
  function showSection(id) {
    const sections = document.querySelectorAll('.section');
    sections.forEach(s => {
      s.classList.remove('active');
      s.style.display = 'none';
    });

    const target = document.getElementById(id);
    if (target) {
      target.style.display = 'block';
      setTimeout(() => target.classList.add('active'), 10);
    }
    window.scrollTo(0,0);
  }

  // Generar Unidades
  const unitsContainer = document.getElementById('units');
  for (let u = 1; u <= 4; u++) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.innerHTML = <div class="task-icon"><i class="fas fa-box"></i></div><div class="task-label">UNIDAD ${u}</div>;
    card.onclick = () => {
      document.getElementById('unit-title').textContent = "Semanas Unidad " + u;
      const weeksContainer = document.getElementById('weeks');
      weeksContainer.innerHTML = "";
      let start = (u - 1) * 4 + 1;
      for (let i = start; i <= start + 3; i++) {
        const wCard = document.createElement('div');
        wCard.className = 'task-card';
        wCard.innerHTML = <div class="task-icon"><i class="fas fa-database"></i></div><div class="task-label">Semana ${i}</div>;
        wCard.onclick = () => loadWeek(i);
        weeksContainer.appendChild(wCard);
      }
      showSection('weeks-view');
    };
    unitsContainer.appendChild(card);
  }

  async function loadWeek(num) {
    const weekName = "Semana" + num;
    showSection('semana-view');
    document.getElementById('semana-title').textContent = "Archivos: " + weekName;
    const fileContainer = document.getElementById('file-container');
    document.getElementById('repo-link').href = https://github.com/${repoUser}/${repoName}/tree/main/${weekName};
    fileContainer.innerHTML = "Cargando...";

    try {
      const res = await fetch(https://api.github.com/repos/${repoUser}/${repoName}/contents/${weekName});
      const data = await res.json();
      if (Array.isArray(data)) {
        fileContainer.innerHTML = data.map(f => <a href="${f.download_url}" target="_blank"><i class="far fa-file"></i> ${f.name}</a>).join('');
      } else { fileContainer.innerHTML = "Carpeta vacía."; }
    } catch (e) { fileContainer.innerHTML = "Error."; }
  }

  function login() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;
    const m = document.getElementById("login-msg");
    if (u === "kevin" && p === "123456") {
      m.style.color = "#00ff88"; m.textContent = "Bienvenido.";
    } else {
      m.style.color = "#ff4444"; m.textContent = "Error.";
    }
  }
</script>
</body>
</html>
