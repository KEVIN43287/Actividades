<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BASE DE DATOS 2 - Inicio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg:#0f1110;--panel:#161616;--accent:#00ff88;--muted:#b9e6c4;
      --text:#e9efe8;--card-border: rgba(0,255,136,0.12);
    }
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;font-family:"Poppins",Arial,sans-serif;background:var(--bg);color:var(--text);}

    header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:18px 26px;background:#0b0b0b;}
    .header-left img{height:72px;border-radius:8px;}
    .header-center{text-align:center;}
    .header-center h1{margin:0;font-size:22px;text-transform:uppercase;}
    .uni{font-size:13px;color:var(--muted);}
    .name{font-size:14px;font-weight:600;color:var(--accent);}
    nav.header-nav{display:flex;gap:12px;}
    nav.header-nav a{color:var(--accent);text-decoration:none;font-weight:600;padding:8px 12px;border-radius:8px;}
    nav.header-nav a:hover{background:rgba(0,255,136,0.06);}

    main{max-width:1100px;margin:28px auto;padding:0 18px;}
    .panel{background:var(--panel);border-radius:12px;padding:22px;border:1px solid var(--card-border);}
    h2{color:var(--accent);}

    .tasks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:18px;}
    .task-card{padding:20px;text-align:center;border-radius:12px;border:2px solid var(--card-border);cursor:pointer;}
    .task-card:hover{border-color:var(--accent);}

    .section{display:none;}
    .section.active{display:block;}

    input{padding:10px;border-radius:8px;border:none;margin:5px 0;width:100%;}
    button{padding:10px;border:none;border-radius:8px;background:var(--accent);cursor:pointer;}

    .error{color:red;margin-top:10px;}
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="upla.PNG" alt="Logo">
  </div>
  <div class="header-center">
    <h1>BASE DE DATOS 2</h1>
    <div class="uni">Universidad Peruana Los Andes</div>
    <div class="name">Kevin Alfredo Macha Bruno</div>
  </div>
  <nav class="header-nav">
    <a href="#" onclick="showSection('inicio')">Inicio</a>
    <a href="#" onclick="showSection('tareas')">Tareas</a>
    <a href="#" onclick="showSection('login')">Login</a>
  </nav>
</header>

<main>

<section id="inicio" class="section active">
  <div class="panel">
    <h2>Bienvenido</h2>
    <p>Portal del curso Base de Datos 2</p>
  </div>
</section>

<section id="tareas" class="section">
  <div class="panel">
    <h2>Unidades</h2>
    <div class="tasks-grid" id="units"></div>
  </div>
</section>

<section id="weeks-view" class="section">
  <div class="panel">
    <h2 id="unit-title"></h2>
    <div class="tasks-grid" id="weeks"></div>
  </div>
</section>

<section id="semana-view" class="section">
  <div class="panel">
    <h2 id="semana-title"></h2>
    <div id="file-container"></div>
    <a id="repo-link" target="_blank">Ir al repositorio</a>
  </div>
</section>

<section id="login" class="section">
  <div class="panel">
    <h2>Login</h2>
    <input type="text" id="user" placeholder="Usuario">
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
    <div id="error" class="error"></div>
  </div>
</section>

</main>

<script>

const repoUser="KEVIN43287";
const repoName="Actividades";

function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// UNIDADES
const unitsContainer=document.getElementById('units');
for(let u=1;u<=4;u++){
  let div=document.createElement('div');
  div.className="task-card";
  div.innerText="Unidad "+u;
  div.onclick=()=>loadUnit(u);
  unitsContainer.appendChild(div);
}

// CARGAR SEMANAS
function loadUnit(u){
  showSection('weeks-view');
  const weeks=document.getElementById('weeks');
  weeks.innerHTML="";
  let start=(u-1)*4+1;
  let end=start+3;

  for(let i=start;i<=end;i++){
    let card=document.createElement('div');
    card.className="task-card";
    card.innerText="Semana "+i;
    card.onclick=()=>loadWeek(i);
    weeks.appendChild(card);
  }
}

// CARGAR ARCHIVOS
async function loadWeek(num){
  showSection('semana-view');
  document.getElementById('semana-title').innerText="Semana "+num;

  const container=document.getElementById('file-container');
  container.innerHTML="Cargando...";

  const res=await fetch(https://api.github.com/repos/${repoUser}/${repoName}/contents/Semana${num});
  const data=await res.json();

  container.innerHTML=data.map(f=><a href="${f.download_url}" target="_blank">${f.name}</a>).join('<br>');
}

// LOGIN
function login(){
  const u=document.getElementById('user').value;
  const p=document.getElementById('pass').value;
  const error=document.getElementById('error');

  if(u==="kevin" && p==="123456"){
    alert("Bienvenido Kevin (modo admin activado)");
    error.innerText="";
  }else{
    error.innerText="Usuario o contraseña incorrectos";
  }
}

</script>

</body>
</html>
