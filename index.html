<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BASE DE DATOS 2 - Inicio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg:#050706; 
      --panel:rgba(22, 22, 22, 0.8);
      --accent:#00ff88;
      --muted:#b9e6c4;
      --text:#e9efe8;
      --card-border: rgba(0,255,136,0.2);
    }
    *{box-sizing:border-box}html,body{height:100%}
    body{
      margin:0;
      font-family:"Poppins",Arial,sans-serif;
      background:var(--bg);
      background-image: radial-gradient(circle at 50% -20%, #1a3a2a, transparent);
      color:var(--text);
      line-height:1.5;
    }

    header{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:20px;
      padding:18px 26px;
      background:rgba(11, 11, 11, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
    }
    .header-left img{
      height:72px;
      border-radius:8px;
      filter: drop-shadow(0 0 5px var(--accent));
    }
    
    .header-center{text-align:center;}
    .header-center h1{
      margin:0;
      font-size:22px;
      text-transform:uppercase;
      color: #fff;
      text-shadow: 0 0 10px var(--accent);
      animation: pulsado 2s infinite alternate;
    }

    @keyframes pulsado {
      from { text-shadow: 0 0 5px var(--accent); }
      to { text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent); }
    }

    .uni{margin-top:6px;font-size:13px;color:var(--muted);}
    .name{margin-top:4px;font-size:14px;font-weight:600;color:var(--accent);}
    
    nav.header-nav{display:flex;gap:12px;justify-self:end;}
    nav.header-nav a{
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
      padding:8px 12px;
      border-radius:8px;
      transition:all .3s ease;
      cursor:pointer;
      border: 1px solid transparent;
    }
    nav.header-nav a:hover{
      background:rgba(0,255,136,0.1);
      box-shadow: 0 0 15px rgba(0,255,136,0.3);
      transform:translateY(-3px);
    }

    main{max-width:1100px;margin:28px auto;padding:0 18px 60px;}
    
    .panel{
      background:var(--panel);
      backdrop-filter: blur(5px);
      border-radius:12px;
      padding:22px;
      box-shadow:0 0 30px rgba(0,0,0,0.5);
      border:1px solid var(--card-border);
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2{margin:0 0 14px;color:var(--accent);font-size:20px; text-shadow: 0 0 5px rgba(0,255,136,0.4);}
    .tasks-grid{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;}
    
    .task-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      text-align:center;
      padding:22px;
      border-radius:12px;
      border:2px solid var(--card-border);
      cursor:pointer;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.02);
    }
    .task-card:hover{
      border-color: var(--accent);
      background: rgba(0,255,136,0.05);
      box-shadow: 0 0 20px rgba(0,255,136,0.2);
      transform: scale(1.05);
    }
    .task-icon i { font-size: 24px; color: var(--accent); }

    .task-label{font-weight:600;}

    .section{display:none;opacity:0;}
    .section.active{display:block;opacity:1;}

    .file-list a{
      display:block;
      color:var(--muted);
      margin:4px 0;
      text-decoration:none;
      padding: 10px;
      border-radius: 5px;
      transition: 0.2s;
    }
    .file-list a:hover{
      color:var(--accent);
      background: rgba(0,255,136,0.1);
      padding-left: 15px;
    }
    .repo-btn{
      margin-top:14px;
      display:inline-block;
      padding:10px 20px;
      background:var(--accent);
      color:#000;
      border-radius:8px;
      text-decoration:none;
      font-weight:600;
      transition: 0.3s;
    }
    .repo-btn:hover { box-shadow: 0 0 15px var(--accent); transform: scale(1.05); }

    #login input { 
      display: block; margin-bottom: 15px; padding: 12px; width: 100%; 
      max-width: 300px; background: #000; border: 1px solid var(--card-border); 
      color: white; border-radius: 8px; outline: none;
    }
    #login input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
    #login button { padding: 12px 25px; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    #login button:hover { box-shadow: 0 0 15px var(--accent); }

  </style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="upla.PNG" alt="Logo">
  </div>
  <div class="header-center">
    <h1>BASE DE DATOS 2</h1>
    <div class="uni">Universidad Peruana Los Andes</div>
    <div class="name">Kevin Alfredo Macha Bruno</div>
  </div>
  <nav class="header-nav">
    <a onclick="showSection(event,'inicio')">Inicio</a>
    <a onclick="showSection(event,'tareas')">Tareas</a>
    <a onclick="showSection(event,'login')">Login</a>
  </nav>
</header>

<main>

<section id="inicio" class="section active">
  <div class="panel">
    <h2>Bienvenido</h2>
    <p>Bienvenido al portal de <strong>Base de Datos 2</strong>.</p>
  </div>
</section>

<section id="tareas" class="section">
  <div class="panel">
    <h2>Unidades</h2>
    <div class="tasks-grid" id="units"></div>
  </div>
</section>

<section id="weeks-view" class="section">
  <div class="panel">
    <h2 id="unit-title"></h2>
    <div class="tasks-grid" id="weeks"></div>
    <button onclick="showSection(event,'tareas')" style="margin-top:20px; background:transparent; border:1px solid var(--accent); color:var(--accent); padding:10px; cursor:pointer; border-radius:8px;">Volver a Unidades</button>
  </div>
</section>

<section id="semana-view" class="section">
  <div class="panel">
    <h2 id="semana-title"></h2>
    <div id="file-container" class="file-list"></div>
    <div style="display:flex; gap:10px; align-items:center;">
      <a id="repo-link" class="repo-btn" target="_blank">Ir al repositorio</a>
      <button onclick="showSection(event,'weeks-view')" style="margin-top:14px; background:transparent; border:1px solid #555; color:#fff; padding:10px; cursor:pointer; border-radius:8px;">Atrás</button>
    </div>
  </div>
</section>

<section id="login" class="section">
  <div class="panel">
    <h2>Login</h2>
    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
    <p id="login-msg" style="margin-top:10px;"></p>
  </div>
</section>

</main>

<script>
  const weeksContainer = document.getElementById('weeks');
  const unitsContainer = document.getElementById('units');
  const repoUser = "KEVIN43287";
  const repoName = "Actividades";

  for (let u = 1; u <= 4; u++) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.innerHTML = `
      <div class="task-icon"><i class="fas fa-folder"></i></div>
      <div class="task-label">Unidad ${u}</div>
    `;
    card.onclick = () => showWeeksOfUnit(u);
    unitsContainer.appendChild(card);
  }

  function showWeeksOfUnit(unitNum) {
    document.getElementById('unit-title').textContent = "Semanas de la Unidad " + unitNum;
    weeksContainer.innerHTML = "";
    
    let start = (unitNum - 1) * 4 + 1;
    let end = start + 3;

    for (let i = start; i <= end; i++) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.innerHTML = `
        <div class="task-icon"><i class="fas fa-database"></i></div>
        <div class="task-num">${String(i).padStart(2,'0')}</div>
        <div class="task-label">Semana ${i}</div>
      `;
      card.onclick = () => loadWeek(i);
      weeksContainer.appendChild(card);
    }
    showSection(null, 'weeks-view');
  }

  function showSection(e, id) {
    if (e) e.preventDefault();
    const sections = document.querySelectorAll('.section');
    sections.forEach(sec => {
        sec.classList.remove('active');
        sec.style.display = 'none';
    });

    const target = document.getElementById(id);
    if (target) {
        target.style.display = 'block';
        setTimeout(() => target.classList.add('active'), 10);
    }
  }

  async function loadWeek(num) {
    // CORRECCIÓN: Si es la semana 1, usa el nombre con espacio como está en tu GitHub
    const weekName = (num === 1) ? "Semana 1" : "Semana" + num; 
    
    showSection(null, 'semana-view');

    document.getElementById('semana-title').textContent = "Archivos - " + weekName;
    const fileContainer = document.getElementById('file-container');
    const repoLink = document.getElementById('repo-link');

    // Usamos encodeURIComponent para manejar el espacio en la URL de GitHub
    repoLink.href = "https://github.com/" + repoUser + "/" + repoName + "/tree/main/" + encodeURIComponent(weekName);
    fileContainer.innerHTML = "Cargando archivos...";

    try {
      const res = await fetch("https://api.github.com/repos/" + repoUser + "/" + repoName + "/contents/" + encodeURIComponent(weekName));
      const data = await res.json();

      if (Array.isArray(data)) {
        fileContainer.innerHTML = data.map(f => `
          <div>
            <a href="${f.download_url}" target="_blank"><i class="far fa-file-alt"></i> ${f.name}</a>
          </div>
        `).join('');
      } else {
        fileContainer.innerHTML = "No se encontraron archivos en la carpeta: " + weekName;
      }
    } catch (error) {
      fileContainer.innerHTML = "Error al conectar con el repositorio.";
    }
  }

  function login() {
    const user = document.getElementById("user").value;
    const pass = document.getElementById("pass").value;
    const msg = document.getElementById("login-msg");

    if (user === "kevin" && pass === "123456") {
      msg.style.color = "lime";
      msg.textContent = "Acceso correcto. ¡Hola Kevin!";
    } else {
      msg.style.color = "red";
      msg.textContent = "Usuario o contraseña incorrectos";
    }
  }
</script>

</body>
</html>
