<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BASE DE DATOS 2 - Kevin Macha</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #050505;
      --panel: rgba(20, 20, 20, 0.8);
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.4);
      --text: #e9efe8;
      --card-border: rgba(0, 255, 136, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% -20%, #1a3a2a, transparent);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER CORREGIDO Y FUNCIONAL */
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 15px 40px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 9999; /* Asegura que esté por encima de todo */
    }

    .header-left img { height: 60px; border-radius: 8px; filter: drop-shadow(0 0 5px var(--accent)); }

    .header-center { text-align: center; }
    .header-center h1 {
      font-size: 22px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent-glow);
      animation: neonPulse 2s infinite alternate;
    }

    @keyframes neonPulse {
      from { text-shadow: 0 0 10px var(--accent-glow); }
      to { text-shadow: 0 0 20px var(--accent); }
    }

    .uni { font-size: 12px; color: #aaa; }
    .name { font-size: 14px; font-weight: 600; color: var(--accent); }

    /* NAVEGACIÓN CORREGIDA */
    nav.header-nav { display: flex; gap: 15px; justify-content: flex-end; }
    nav.header-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer; /* IMPORTANTE: Para que parezca botón */
      transition: 0.3s;
      border: 1px solid transparent;
      display: inline-block;
    }
    nav.header-nav a:hover {
      background: rgba(0, 255, 136, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    main { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

    /* SECCIONES Y PANELES */
    .section { display: none; opacity: 0; }
    .section.active { display: block; animation: fadeIn 0.5s forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel {
      background: var(--panel);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid var(--card-border);
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    /* GRID Y CARDS */
    .tasks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
    .task-card {
      background: rgba(255,255,255,0.03);
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: 0.3s;
    }
    .task-card:hover { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
    .task-icon i { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }

    /* INPUTS Y BOTONES */
    input { width: 100%; max-width: 300px; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; }
    button { padding: 10px 25px; background: var(--accent); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--accent); }

    .file-list a { display: block; padding: 10px; background: rgba(255,255,255,0.05); margin-bottom: 5px; border-radius: 5px; color: #ccc; text-decoration: none; }
    .file-list a:hover { color: var(--accent); background: rgba(0,255,136,0.05); }

  </style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="upla.PNG" alt="Logo">
  </div>
  
  <div class="header-center">
    <h1>Base de Datos 2</h1>
    <div class="uni">Universidad Peruana Los Andes</div>
    <div class="name">Kevin Alfredo Macha Bruno</div>
  </div>

  <nav class="header-nav">
    <a onclick="showSection(event,'inicio')">Inicio</a>
    <a onclick="showSection(event,'tareas')">Tareas</a>
    <a onclick="showSection(event,'login')">Login</a>
  </nav>
</header>

<main>

  <section id="inicio" class="section active">
    <div class="panel">
      <h2><i class="fas fa-terminal"></i> Bienvenido al Portal</h2>
      <p style="margin-top:15px;">Hola <strong>Kevin</strong>, este es tu espacio de trabajo para el curso de Base de Datos 2. Navega por las secciones para revisar tus entregas.</p>
    </div>
  </section>

  <section id="tareas" class="section">
    <div class="panel">
      <h2><i class="fas fa-folder"></i> Unidades Académicas</h2>
      <div class="tasks-grid" id="units"></div>
    </div>
  </section>

  <section id="weeks-view" class="section">
    <div class="panel">
      <h2 id="unit-title"></h2>
      <div class="tasks-grid" id="weeks"></div>
      <button onclick="showSection(event,'tareas')" style="margin-top:20px; background:transparent; border:1px solid var(--accent); color:var(--accent)">Volver a Unidades</button>
    </div>
  </section>

  <section id="semana-view" class="section">
    <div class="panel">
      <h2 id="semana-title"></h2>
      <div id="file-container" class="file-list"></div>
      <div style="margin-top:20px; display:flex; gap:10px;">
        <a id="repo-link" target="_blank" style="text-decoration:none"><button>Ver en GitHub</button></a>
        <button onclick="showSection(event,'weeks-view')" style="background:transparent; border:1px solid #555; color:#fff">Volver</button>
      </div>
    </div>
  </section>

  <section id="login" class="section">
    <div class="panel" style="max-width:400px; margin: 0 auto; text-align:center;">
      <h2><i class="fas fa-user-shield"></i> Acceso</h2>
      <input id="user" placeholder="Usuario">
      <input id="pass" type="password" placeholder="Contraseña">
      <button onclick="login()" style="width:100%">Entrar</button>
      <p id="login-msg" style="margin-top:15px;"></p>
    </div>
  </section>

</main>

<script>
  const repoUser = "KEVIN43287";
  const repoName = "Actividades";

  // FUNCIÓN PRINCIPAL DE NAVEGACIÓN (CORREGIDA)
  function showSection(e, id) {
    if (e) {
      e.preventDefault(); // Evita que la página recargue
      e.stopPropagation(); // Evita conflictos con otros elementos
    }
    
    // Ocultar todas las secciones
    const sections = document.querySelectorAll('.section');
    sections.forEach(s => {
      s.classList.remove('active');
      s.style.display = 'none';
    });

    // Mostrar la sección seleccionada
    const target = document.getElementById(id);
    if (target) {
      target.style.display = 'block';
      // Un pequeño delay para que la animación de CSS (fadeIn) funcione bien
      setTimeout(() => {
        target.classList.add('active');
      }, 10);
    }
    
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  // Generar las 4 Unidades al cargar
  const unitsContainer = document.getElementById('units');
  for (let u = 1; u <= 4; u++) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.innerHTML = <div class="task-icon"><i class="fas fa-box"></i></div><div class="task-label">UNIDAD ${u}</div>;
    card.onclick = () => showWeeksOfUnit(u);
    unitsContainer.appendChild(card);
  }

  function showWeeksOfUnit(unitNum) {
    const weeksContainer = document.getElementById('weeks');
    document.getElementById('unit-title').textContent = "Semanas de la Unidad " + unitNum;
    weeksContainer.innerHTML = "";
    let start = (unitNum - 1) * 4 + 1;
    let end = start + 3;

    for (let i = start; i <= end; i++) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.innerHTML = <div class="task-icon"><i class="fas fa-database"></i></div><div class="task-label">Semana ${i}</div>;
      card.onclick = () => loadWeek(i);
      weeksContainer.appendChild(card);
    }
    showSection(null, 'weeks-view');
  }

  async function loadWeek(num) {
    const weekName = "Semana" + num;
    showSection(null, 'semana-view');
    document.getElementById('semana-title').textContent = "Recursos: " + weekName;
    const fileContainer = document.getElementById('file-container');
    document.getElementById('repo-link').href = https://github.com/${repoUser}/${repoName}/tree/main/${weekName};
    
    fileContainer.innerHTML = "Cargando...";

    try {
      const res = await fetch(https://api.github.com/repos/${repoUser}/${repoName}/contents/${weekName});
      const data = await res.json();
      if (Array.isArray(data)) {
        fileContainer.innerHTML = data.map(f => <a href="${f.download_url}" target="_blank"><i class="far fa-file"></i> ${f.name}</a>).join('');
      } else {
        fileContainer.innerHTML = "No hay archivos.";
      }
    } catch (e) {
      fileContainer.innerHTML = "Error de conexión.";
    }
  }

  function login() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;
    const m = document.getElementById("login-msg");
    if (u === "kevin" && p === "123456") {
      m.style.color = "#00ff88"; m.textContent = "¡Acceso concedido!";
    } else {
      m.style.color = "#ff4444"; m.textContent = "Datos incorrectos.";
    }
  }
</script>

</body>
</html>
