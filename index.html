<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BASE DE DATOS 2 - Inicio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg:#0f1110;--panel:#161616;--accent:#00ff88;--muted:#b9e6c4;
      --text:#e9efe8;--card-border: rgba(0,255,136,0.12);
    }
    body{margin:0;font-family:"Poppins";background:var(--bg);color:var(--text);}
    header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:18px 26px;background:#0b0b0b;}
    .header-left img{height:72px;border-radius:8px;}
    nav a{color:var(--accent);margin:0 5px;text-decoration:none;cursor:pointer;}
    main{max-width:1100px;margin:28px auto;padding:0 18px;}
    .section{display:none;}
    .section.active{display:block;}
    .task-card{padding:20px;border:1px solid #333;margin:10px;cursor:pointer;text-align:center;}
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="upla.PNG">
  </div>

  <div>
    <h2>BASE DE DATOS 2</h2>
    <p>Universidad Peruana Los Andes</p>
  </div>

  <nav>
    <a onclick="showSection('inicio')">Inicio</a>
    <a onclick="showSection('tareas')">Tareas</a>
    <a onclick="showSection('login')">Login</a>
  </nav>
</header>

<main>

<section id="inicio" class="section active">
  <h2>Bienvenido</h2>
</section>

<section id="tareas" class="section">
  <h2>Unidades</h2>
  <div id="units"></div>
</section>

<section id="weeks-view" class="section">
  <h2 id="unit-title"></h2>
  <div id="weeks"></div>
</section>

<section id="semana-view" class="section">
  <h2 id="semana-title"></h2>
  <div id="file-container"></div>
</section>

<section id="login" class="section">
  <h2>Login</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
  <p id="error" style="color:red;"></p>
</section>

</main>

<script>

document.addEventListener("DOMContentLoaded", ()=>{

const repoUser="KEVIN43287";
const repoName="Actividades";

window.showSection = function(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// UNIDADES
const units=document.getElementById('units');
for(let u=1;u<=4;u++){
  let div=document.createElement('div');
  div.className="task-card";
  div.innerText="Unidad "+u;
  div.onclick=()=>loadUnit(u);
  units.appendChild(div);
}

// SEMANAS
window.loadUnit=function(u){
  showSection('weeks-view');
  const weeks=document.getElementById('weeks');
  weeks.innerHTML="";
  let start=(u-1)*4+1;
  let end=start+3;

  for(let i=start;i<=end;i++){
    let div=document.createElement('div');
    div.className="task-card";
    div.innerText="Semana "+i;
    div.onclick=()=>loadWeek(i);
    weeks.appendChild(div);
  }
}

// ARCHIVOS
window.loadWeek=async function(num){
  showSection('semana-view');
  document.getElementById('semana-title').innerText="Semana "+num;

  const cont=document.getElementById('file-container');
  cont.innerHTML="Cargando...";

  try{
    const res=await fetch(https://api.github.com/repos/${repoUser}/${repoName}/contents/Semana${num});
    const data=await res.json();

    cont.innerHTML=data.map(f=><a href="${f.download_url}" target="_blank">${f.name}</a>).join('<br>');
  }catch{
    cont.innerHTML="Error cargando archivos";
  }
}

// LOGIN
window.login=function(){
  const u=document.getElementById('user').value;
  const p=document.getElementById('pass').value;

  if(u==="kevin" && p==="123456"){
    alert("Bienvenido Kevin");
    document.getElementById('error').innerText="";
  }else{
    document.getElementById('error').innerText="Usuario o contraseña incorrectos";
  }
}

});

</script>

</body>
</html>
