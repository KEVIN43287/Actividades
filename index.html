<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASE DE DATOS 2 - PORTAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/バランス/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .hero-section {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, rgba(79, 172, 254, 0.1) 0%, transparent 100%);
        }

        .glow-text {
            text-shadow: 0 0 15px var(--primary);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .card-custom {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .card-custom:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 500;
            margin: 0 10px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: var(--primary) !important;
        }

        .btn-glow {
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        section { padding: 60px 0; display: none; }
        section.active { display: block; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand glow-text" href="#" onclick="showSection('inicio')">BD2 PORTAL</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('inicio')">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('tareas')">Tareas</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('login')">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <section id="inicio" class="active">
        <div class="hero-section">
            <h1 class="display-4 glow-text mb-3">UNIVERSIDAD PERUANA LOS ANDES</h1>
            <h3 class="text-info mb-4">BASE DE DATOS 2</h3>
            <p class="lead">Estudiante: Kevin Alfredo Macha Bruno</p>
        </div>
    </section>

    <section id="tareas">
        <h2 class="text-center mb-5 glow-text">Actividades del Semestre</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card-custom p-4 text-center" onclick="window.location.href='Semana 1/index.html'">
                    <i class="fas fa-folder-open fa-3x mb-3 text-info"></i>
                    <h4>Semana 1</h4>
                    <p class="text-muted">Introducción y configuración</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-custom p-4 text-center" onclick="window.location.href='Semana 2/index.html'">
                    <i class="fas fa-database fa-3x mb-3 text-info"></i>
                    <h4>Semana 2</h4>
                    <p class="text-muted">Modelado de Datos</p>
                </div>
            </div>
        </div>
    </section>

    <section id="login">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card-custom p-5">
                    <h3 class="text-center mb-4">Iniciar Sesión</h3>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" id="userInput" class="form-control bg-dark text-white border-secondary">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="passInput" class="form-control bg-dark text-white border-secondary">
                        </div>
                        <button type="button" onclick="validarLogin()" class="btn btn-glow w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    function showSection(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function validarLogin() {
        const user = document.getElementById('userInput').value;
        const pass = document.getElementById('passInput').value;
        
        if(user === "kevin" && pass === "123456") {
            alert("¡Bienvenido Kevin!");
            showSection('tareas');
        } else {
            alert("Datos incorrectos");
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
