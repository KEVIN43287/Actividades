<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BASE DE DATOS 2 - Inicio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>

    /* =========================================================
       VARIABLES
       ========================================================= */

    :root{
      --bg:#030605;
      --bg2:#06100b;

      --panel:rgba(10,18,14,.86);
      --panel2:rgba(7,13,10,.94);

      --accent:#00ff88;
      --accent2:#20e89a;

      --text:#f3f8f5;
      --muted:#9eb4a8;
      --muted2:#71877a;

      --border:rgba(0,255,136,.15);
      --border-strong:rgba(0,255,136,.38);

      --shadow:rgba(0,0,0,.55);

      --radius:20px;
      --ease:cubic-bezier(.2,.75,.2,1);
    }


    /* =========================================================
       RESET
       ========================================================= */

    *,
    *::before,
    *::after{
      box-sizing:border-box;
    }

    html{
      min-height:100%;
      scroll-behavior:smooth;
    }

    body{
      min-height:100%;
      margin:0;

      font-family:"Poppins",Arial,sans-serif;
      color:var(--text);
      line-height:1.5;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(0,255,136,.12),
          transparent 34%
        ),
        radial-gradient(
          circle at 0% 55%,
          rgba(0,255,136,.035),
          transparent 25%
        ),
        radial-gradient(
          circle at 100% 80%,
          rgba(0,255,136,.025),
          transparent 27%
        ),
        linear-gradient(
          145deg,
          #020403,
          #050a07 50%,
          #020302
        );

      overflow-x:hidden;
      position:relative;
    }


    /* =========================================================
       FONDO TECNOLÓGICO
       ========================================================= */

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-5;

      pointer-events:none;

      background:
        linear-gradient(
          rgba(0,255,136,.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0,255,136,.035) 1px,
          transparent 1px
        );

      background-size:52px 52px;

      opacity:.28;

      mask-image:
        linear-gradient(
          to bottom,
          black 0%,
          rgba(0,0,0,.75) 55%,
          transparent 100%
        );
    }


    body::after{
      content:"";
      position:fixed;

      width:500px;
      height:500px;

      right:-230px;
      top:20%;

      z-index:-4;
      pointer-events:none;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(0,255,136,.065),
          rgba(0,255,136,.025) 40%,
          transparent 70%
        );

      filter:blur(25px);

      animation:ambientMove 12s ease-in-out infinite alternate;
    }


    @keyframes ambientMove{
      from{
        transform:translate3d(0,0,0) scale(1);
      }

      to{
        transform:translate3d(-80px,45px,0) scale(1.12);
      }
    }


    /* =========================================================
       HEADER
       ========================================================= */

    header{
      position:sticky;
      top:0;
      z-index:100;

      display:grid;
      grid-template-columns:auto 1fr auto;

      align-items:center;

      gap:28px;

      min-height:92px;

      padding:
        14px
        clamp(18px,4vw,46px);

      background:
        linear-gradient(
          180deg,
          rgba(7,13,10,.97),
          rgba(4,8,6,.91)
        );

      border-bottom:
        1px solid rgba(0,255,136,.14);

      box-shadow:
        0 14px 40px rgba(0,0,0,.48),
        inset 0 -1px 0 rgba(255,255,255,.025);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }


    header::before{
      content:"";

      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:1px;

      pointer-events:none;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(0,255,136,.7),
          transparent
        );

      opacity:.5;

      animation:headerLine 7s linear infinite;
    }


    @keyframes headerLine{
      0%{
        transform:translateX(-40%);
        opacity:.2;
      }

      50%{
        opacity:.9;
      }

      100%{
        transform:translateX(40%);
        opacity:.2;
      }
    }


    /* =========================================================
       LOGO
       ========================================================= */

    .header-left{
      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;
    }


    .header-left::after{
      content:"";

      position:absolute;

      width:76px;
      height:76px;

      border-radius:18px;

      border:
        1px solid rgba(0,255,136,.11);

      transform:rotate(45deg);

      pointer-events:none;
    }


    .header-left img{
      position:relative;
      z-index:1;

      display:block;

      height:64px;
      width:auto;

      border-radius:10px;

      object-fit:contain;

      filter:
        drop-shadow(0 0 7px rgba(0,255,136,.4))
        drop-shadow(0 0 20px rgba(0,255,136,.1));

      transition:
        transform .35s var(--ease),
        filter .35s ease;
    }


    .header-left:hover img{
      transform:scale(1.04) translateY(-2px);

      filter:
        drop-shadow(0 0 10px rgba(0,255,136,.58))
        drop-shadow(0 0 25px rgba(0,255,136,.16));
    }


    /* =========================================================
       TITULO HEADER
       ========================================================= */

    .header-center{
      min-width:0;
      text-align:center;
    }


    .header-center h1{
      display:inline-block;

      margin:0;

      color:#fff;

      font-size:
        clamp(18px,2vw,25px);

      font-weight:700;

      letter-spacing:.12em;

      text-transform:uppercase;

      line-height:1.2;

      text-shadow:
        0 0 18px rgba(0,255,136,.24);
    }


    .header-center h1::after{
      content:"";

      display:block;

      width:42%;
      height:2px;

      margin:
        9px auto
        0;

      border-radius:20px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );

      box-shadow:
        0 0 12px rgba(0,255,136,.35);
    }


    .uni{
      margin-top:6px;

      color:var(--muted);

      font-size:12px;

      letter-spacing:.03em;
    }


    .name{
      margin-top:3px;

      color:var(--accent);

      font-size:13px;

      font-weight:600;
    }


    /* =========================================================
       NAVEGACION
       ========================================================= */

    nav.header-nav{
      display:flex;
      align-items:center;

      gap:6px;

      padding:5px;

      border:
        1px solid rgba(255,255,255,.055);

      border-radius:14px;

      background:
        rgba(255,255,255,.025);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        0 8px 24px rgba(0,0,0,.25);
    }


    nav.header-nav a{
      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:8px;

      min-width:88px;

      padding:
        10px 14px;

      border:
        1px solid transparent;

      border-radius:10px;

      color:#a9baaf;

      text-decoration:none;

      font-size:13px;
      font-weight:600;

      cursor:pointer;

      overflow:hidden;

      transition:
        color .25s var(--ease),
        background .25s var(--ease),
        border-color .25s var(--ease),
        box-shadow .25s var(--ease),
        transform .25s var(--ease);
    }


    nav.header-nav a::before{
      font-family:"Font Awesome 6 Free";
      font-weight:900;

      font-size:11px;

      opacity:.75;

      pointer-events:none;
    }


    nav.header-nav a:nth-child(1)::before{
      content:"\f015";
    }


    nav.header-nav a:nth-child(2)::before{
      content:"\f07b";
    }


    nav.header-nav a:nth-child(3)::before{
      content:"\f2f6";
    }


    nav.header-nav a::after{
      content:"";

      position:absolute;

      left:18%;
      right:18%;
      bottom:3px;

      height:2px;

      border-radius:20px;

      background:var(--accent);

      transform:scaleX(0);

      opacity:0;

      pointer-events:none;

      transition:
        transform .3s var(--ease),
        opacity .3s ease;
    }


    nav.header-nav a:hover{
      color:#fff;

      background:
        rgba(0,255,136,.07);

      border-color:
        rgba(0,255,136,.15);

      box-shadow:
        0 7px 20px rgba(0,0,0,.28),
        inset 0 0 18px rgba(0,255,136,.035);

      transform:translateY(-2px);
    }


    nav.header-nav a:hover::after{
      transform:scaleX(1);
      opacity:.7;
    }


    nav.header-nav a:active{
      transform:scale(.97);
    }


    nav.header-nav a:focus-visible{
      outline:none;

      border-color:var(--accent);

      box-shadow:
        0 0 0 3px rgba(0,255,136,.1);
    }


    /* ESTADO ACTIVO */

    body:has(#inicio.active)
    nav.header-nav a:nth-child(1),

    body:has(#tareas.active)
    nav.header-nav a:nth-child(2),

    body:has(#weeks-view.active)
    nav.header-nav a:nth-child(2),

    body:has(#semana-view.active)
    nav.header-nav a:nth-child(2),

    body:has(#login.active)
    nav.header-nav a:nth-child(3){

      color:#fff;

      background:
        linear-gradient(
          135deg,
          rgba(0,255,136,.15),
          rgba(0,255,136,.04)
        );

      border-color:
        rgba(0,255,136,.24);

      box-shadow:
        inset 0 0 18px rgba(0,255,136,.04),
        0 5px 18px rgba(0,255,136,.06);
    }


    body:has(#inicio.active)
    nav.header-nav a:nth-child(1)::after,

    body:has(#tareas.active)
    nav.header-nav a:nth-child(2)::after,

    body:has(#weeks-view.active)
    nav.header-nav a:nth-child(2)::after,

    body:has(#semana-view.active)
    nav.header-nav a:nth-child(2)::after,

    body:has(#login.active)
    nav.header-nav a:nth-child(3)::after{

      transform:scaleX(1);
      opacity:1;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main{
      position:relative;

      width:min(1180px,100%);

      margin:
        0 auto;

      padding:
        clamp(30px,5vw,58px)
        clamp(16px,4vw,30px)
        80px;
    }


    main::before{
      content:"";

      position:absolute;

      top:0;
      left:50%;

      width:min(720px,75%);
      height:1px;

      transform:translateX(-50%);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(0,255,136,.18),
          transparent
        );

      pointer-events:none;
    }


    /* =========================================================
       SECCIONES
       ========================================================= */

    .section{
      display:none;
      opacity:0;
    }


    .section.active{
      display:block;
      opacity:1;

      animation:
        sectionReveal .42s var(--ease) both;
    }


    @keyframes sectionReveal{

      from{
        opacity:0;

        transform:
          translateY(14px)
          scale(.985);

        filter:blur(4px);
      }

      to{
        opacity:1;

        transform:
          translateY(0)
          scale(1);

        filter:blur(0);
      }
    }


    /* =========================================================
       PANELES
       ========================================================= */

    .panel{
      position:relative;
      isolation:isolate;

      overflow:hidden;

      padding:
        clamp(24px,4vw,38px);

      background:
        linear-gradient(
          145deg,
          rgba(15,25,20,.84),
          rgba(5,10,8,.93)
        );

      border:
        1px solid rgba(0,255,136,.14);

      border-radius:var(--radius);

      box-shadow:
        0 28px 70px rgba(0,0,0,.48),
        0 8px 25px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.045);

      backdrop-filter:blur(15px);
      -webkit-backdrop-filter:blur(15px);

      animation:
        panelEnter .55s var(--ease) both;
    }


    .panel::before{
      content:"";

      position:absolute;

      z-index:-1;

      top:0;
      left:0;
      right:0;

      height:1px;

      background:
        linear-gradient(
          90deg,
          transparent 3%,
          rgba(0,255,136,.75) 30%,
          rgba(0,255,136,.16) 70%,
          transparent 97%
        );

      opacity:.65;

      pointer-events:none;
    }


    .panel::after{
      content:"";

      position:absolute;

      z-index:-1;

      width:250px;
      height:250px;

      right:-120px;
      top:-140px;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(0,255,136,.08),
          rgba(0,255,136,.025) 42%,
          transparent 70%
        );

      pointer-events:none;
    }


    @keyframes panelEnter{

      from{
        opacity:0;
        transform:translateY(12px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }


    /* =========================================================
       TITULOS
       ========================================================= */

    h2{
      position:relative;

      width:max-content;
      max-width:100%;

      margin:
        0 0 16px;

      color:#fff;

      font-size:
        clamp(19px,2.5vw,25px);

      font-weight:700;

      letter-spacing:.02em;

      line-height:1.25;

      text-shadow:
        0 0 18px rgba(0,255,136,.15);
    }


    h2::after{
      content:"";

      display:block;

      width:38px;
      height:3px;

      margin-top:10px;

      border-radius:20px;

      background:var(--accent);

      box-shadow:
        0 0 12px rgba(0,255,136,.38);
    }


    p{
      color:var(--muted);
    }


    strong{
      color:#fff;
      font-weight:600;
    }


    /* =========================================================
       INICIO
       ========================================================= */

    #inicio .panel{
      min-height:310px;

      display:grid;

      grid-template-columns:
        minmax(0,1.25fr)
        minmax(240px,.75fr);

      align-items:center;

      column-gap:40px;

      padding-right:
        clamp(28px,6vw,70px);
    }


    #inicio .panel::after{
      width:330px;
      height:330px;

      right:-65px;
      top:50%;

      transform:translateY(-50%);

      border:
        1px solid rgba(0,255,136,.11);

      background:
        radial-gradient(
          circle at center,
          rgba(0,255,136,.11) 0 1px,
          transparent 2px
        ),
        radial-gradient(
          circle,
          rgba(0,255,136,.08),
          rgba(0,255,136,.02) 42%,
          transparent 69%
        ),
        repeating-radial-gradient(
          circle,
          transparent 0 37px,
          rgba(0,255,136,.055) 38px 39px
        );

      box-shadow:
        0 0 60px rgba(0,255,136,.06),
        inset 0 0 50px rgba(0,255,136,.04);

      animation:
        heroOrb 14s linear infinite;
    }


    @keyframes heroOrb{

      from{
        transform:
          translateY(-50%)
          rotate(0deg);
      }

      to{
        transform:
          translateY(-50%)
          rotate(360deg);
      }
    }


    #inicio h2{
      font-size:
        clamp(28px,4vw,42px);

      letter-spacing:-.02em;

      margin-bottom:12px;
    }


    #inicio h2::before{
      content:"";

      display:inline-block;

      width:7px;
      height:7px;

      margin:
        0 10px 5px 0;

      border-radius:50%;

      background:var(--accent);

      box-shadow:
        0 0 10px rgba(0,255,136,.8),
        0 0 25px rgba(0,255,136,.3);

      animation:
        statusPulse 2.2s ease-in-out infinite;
    }


    @keyframes statusPulse{

      0%,100%{
        opacity:.55;
        transform:scale(.85);
      }

      50%{
        opacity:1;
        transform:scale(1.15);
      }
    }


    #inicio p{
      max-width:650px;

      margin:0;

      font-size:
        clamp(14px,1.7vw,16px);

      line-height:1.9;
    }


    #inicio p::after{
      content:"";

      display:block;

      width:100px;
      height:1px;

      margin-top:24px;

      background:
        linear-gradient(
          90deg,
          var(--accent),
          transparent
        );

      opacity:.55;
    }


    /* =========================================================
       TAREAS / SEMANAS
       ========================================================= */

    .tasks-grid{
      position:relative;

      margin-top:24px;

      display:grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap:18px;
    }


    .task-card{
      position:relative;
      isolation:isolate;

      min-height:165px;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      gap:9px;

      text-align:center;

      padding:
        24px 18px;

      border:
        1px solid rgba(0,255,136,.13);

      border-radius:18px;

      cursor:pointer;

      overflow:hidden;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0,255,136,.055),
          transparent 52%
        ),
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        );

      box-shadow:
        0 14px 30px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.035);

      transform:translateZ(0);

      transition:
        transform .35s var(--ease),
        border-color .35s ease,
        background .35s ease,
        box-shadow .35s ease;

      animation:
        cardIn .5s var(--ease) both;
    }


    @keyframes cardIn{

      from{
        opacity:0;

        transform:
          translateY(15px)
          scale(.97);
      }

      to{
        opacity:1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .task-card:nth-child(1){
      animation-delay:.04s;
    }

    .task-card:nth-child(2){
      animation-delay:.08s;
    }

    .task-card:nth-child(3){
      animation-delay:.12s;
    }

    .task-card:nth-child(4){
      animation-delay:.16s;
    }

    .task-card:nth-child(5){
      animation-delay:.20s;
    }

    .task-card:nth-child(6){
      animation-delay:.24s;
    }

    .task-card:nth-child(7){
      animation-delay:.28s;
    }

    .task-card:nth-child(8){
      animation-delay:.32s;
    }


    .task-card::before{
      content:"";

      position:absolute;

      z-index:-1;

      inset:-20%;

      background:
        linear-gradient(
          115deg,
          transparent 35%,
          rgba(255,255,255,.07) 48%,
          transparent 61%
        );

      transform:
        translateX(-65%)
        rotate(5deg);

      opacity:0;

      pointer-events:none;

      transition:
        transform .65s var(--ease),
        opacity .3s ease;
    }


    .task-card::after{
      content:"";

      position:absolute;

      left:14%;
      right:14%;
      bottom:0;

      height:2px;

      border-radius:
        20px 20px 0 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );

      transform:scaleX(.35);

      opacity:.18;

      pointer-events:none;

      transition:
        transform .35s var(--ease),
        opacity .35s ease;
    }


    .task-card:hover{

      transform:
        translateY(-8px)
        scale(1.018);

      border-color:
        rgba(0,255,136,.42);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0,255,136,.12),
          transparent 57%
        ),
        linear-gradient(
          145deg,
          rgba(0,255,136,.055),
          rgba(255,255,255,.018)
        );

      box-shadow:
        0 24px 45px rgba(0,0,0,.45),
        0 0 28px rgba(0,255,136,.09),
        inset 0 1px 0 rgba(255,255,255,.07);
    }


    .task-card:hover::before{
      opacity:1;

      transform:
        translateX(65%)
        rotate(5deg);
    }


    .task-card:hover::after{
      transform:scaleX(1);
      opacity:.8;
    }


    .task-card:active{
      transform:
        translateY(-3px)
        scale(.985);
    }


    .task-icon{
      width:56px;
      height:56px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:15px;

      background:
        linear-gradient(
          145deg,
          rgba(0,255,136,.13),
          rgba(0,255,136,.035)
        );

      border:
        1px solid rgba(0,255,136,.17);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 20px rgba(0,0,0,.22);

      transition:
        transform .35s var(--ease),
        border-color .35s ease,
        box-shadow .35s ease;
    }


    .task-icon i{
      font-size:23px;

      color:var(--accent);

      filter:
        drop-shadow(
          0 0 7px rgba(0,255,136,.3)
        );

      transition:
        transform .35s var(--ease),
        filter .35s ease;
    }


    .task-card:hover .task-icon{
      transform:
        translateY(-3px)
        scale(1.06);

      border-color:
        rgba(0,255,136,.4);

      background:
        rgba(0,255,136,.11);

      box-shadow:
        0 0 20px rgba(0,255,136,.09),
        inset 0 1px 0 rgba(255,255,255,.08);
    }


    .task-card:hover .task-icon i{
      transform:
        scale(1.08)
        rotate(-3deg);

      filter:
        drop-shadow(
          0 0 10px rgba(0,255,136,.55)
        );
    }


    .task-label{
      color:#e8eee9;

      font-size:14px;

      font-weight:600;
    }


    .task-num{
      color:var(--accent);

      font-size:12px;

      font-weight:700;

      letter-spacing:.18em;

      opacity:.75;
    }


    #units .task-card{
      min-height:190px;

    /* =========================================================
       BOTONES GENERALES
       ========================================================= */

    button,
    .repo-btn{
      position:relative;
      overflow:hidden;

      font-family:inherit;
    }


    button::after,
    .repo-btn::after{
      content:"";

      position:absolute;

      inset:0;

      background:
        radial-gradient(
          circle at var(--x,50%) var(--y,50%),
          rgba(255,255,255,.2),
          transparent 36%
        );

      opacity:0;

      pointer-events:none;

      transition:
        opacity .25s ease;

    button:hover::after,
    .repo-btn:hover::after{
      opacity:1;

      padding:
        11px 18px !important;

      color:#dfffee !important;

      background:
        linear-gradient(
          135deg,
          rgba(0,255,136,.09),
          rgba(0,255,136,.025)
        ) !important;

      border:
        1px solid rgba(0,255,136,.28) !important;

      border-radius:11px !important;

      box-shadow:
        0 8px 20px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.04);

      transition:
        transform .3s var(--ease),
        box-shadow .3s ease,
        border-color .3s ease;
    }


    #weeks-view .panel > button::before{
      content:"\f060";

      margin-right:9px;

      font-family:"Font Awesome 6 Free";

    /* =========================================================
       ARCHIVOS
       ========================================================= */

    .file-list{

      display:grid;

      gap:10px;

      margin-top:20px;
    }


    .file-list > div{

      animation:
        fileIn .4s var(--ease) both;
    }


    @keyframes fileIn{

      from{
        opacity:0;
        transform:translateX(-10px);
      }

      to{
        opacity:1;
        transform:translateX(0);
      }
    }


    .file-list > div:nth-child(2){
      animation-delay:.04s;
    }

    .file-list > div:nth-child(3){
      animation-delay:.08s;
    }

    .file-list > div:nth-child(4){
      animation-delay:.12s;
    }

    .file-list > div:nth-child(5){
      animation-delay:.16s;
    }

    .file-list > div:nth-child(6){
      animation-delay:.20s;
    }

      position:relative;

      display:grid;

      grid-template-columns:
        minmax(0,1fr)
        auto;

      align-items:center;

      gap:15px;

      min-height:68px;

      padding:
        10px 12px 10px 14px;

      border:
        1px solid rgba(0,255,136,.1);

      border-radius:14px;

      background:
        linear-gradient(
          100deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        );

      box-shadow:
        0 7px 18px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.025);

      transition:
        transform .3s var(--ease),
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;
    }


    .file-item:hover{

      transform:translateX(4px);

      border-color:
        rgba(0,255,136,.27);

      background:
        linear-gradient(
          100deg,
          rgba(0,255,136,.06),
          rgba(0,255,136,.015)

      box-shadow:
        0 12px 25px rgba(0,0,0,.3),
        0 0 20px rgba(0,255,136,.045);

    .file-info{
      min-width:0;

      display:flex;
      align-items:center;

      gap:12px;
    }


    .file-icon{
      flex:0 0 auto;

      width:38px;
      height:38px;

      justify-content:center;

      border-radius:10px;

        rgba(0,255,136,.07);

      border:
        1px solid rgba(0,255,136,.12);

      transition:
        transform .3s var(--ease),
        background .3s ease,
        box-shadow .3s ease;

    .file-item:hover .file-icon{

      transform:scale(1.07);

      background:
        rgba(0,255,136,.12);

    .file-name{

      min-width:0;

      font-size:13px;

      font-weight:500;

      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;

    .file-name a{

      text-decoration:none;
    }


    .file-actions{

      display:flex;

      align-items:center;

      gap:8px;
    }


    .preview-btn{

      position:relative;

      display:inline-flex;

      align-items:center;
      justify-content:center;

      gap:7px;

      min-height:39px;

      padding:
        9px 13px;

      color:#07150d;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #00d975
        );

      border:
        1px solid rgba(255,255,255,.14);

      border-radius:10px;

      cursor:pointer;

      font-size:11px;

      font-weight:700;

      box-shadow:
        0 7px 17px rgba(0,255,136,.1),
        inset 0 1px 0 rgba(255,255,255,.3);

      transition:
        transform .3s var(--ease),
        box-shadow .3s ease,
        filter .3s ease;

    .preview-btn::before{

      content:"\f06e";

      font-family:"Font Awesome 6 Free";
      font-weight:900;

      pointer-events:none;
    }


    .preview-btn:hover{

      transform:translateY(-3px);

      filter:saturate(1.08);

      box-shadow:
        0 12px 25px rgba(0,0,0,.3),
        0 0 22px rgba(0,255,136,.16);
    }


    .preview-btn:active{

      transform:
        translateY(-1px)
        scale(.98);
    }


    /* =========================================================
       LOADING
       ========================================================= */

    .loading-text{

      display:flex;
      align-items:center;

      gap:10px;

      min-height:55px;

      padding:
        14px 17px;

      color:var(--accent);

      font-size:13px;
      font-weight:500;

      border:
        1px solid rgba(0,255,136,.12);

      border-radius:13px;

      background:

      box-shadow:
        inset 0 0 20px rgba(0,255,136,.025);

        pulseLoading 1.5s infinite ease-in-out;

    @keyframes pulseLoading{

      }

        text-shadow:
          0 0 10px rgba(0,255,136,.65);

    /* =========================================================
       REPOSITORIO
       ========================================================= */

      justify-content:center;

      gap:8px;

      min-height:44px;

      padding:
        11px 19px;

      color:#021108;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #00d975
        );

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:11px;

      text-decoration:none;

      font-size:13px;

      font-weight:700;

      box-shadow:
        0 10px 24px rgba(0,255,136,.12),
        inset 0 1px 0 rgba(255,255,255,.35);

      transition:
        transform .3s var(--ease),
        box-shadow .3s ease;
    }


    .repo-btn::before{

      content:"\f09b";

      font-family:"Font Awesome 6 Free";
      font-weight:900;

      pointer-events:none;
    }


    .repo-btn:hover{

      transform:translateY(-4px);

      box-shadow:
        0 15px 30px rgba(0,0,0,.3),

    }


    #semana-view
    .panel
    > div:last-child
    > button{

      margin-top:14px !important;

      min-height:44px;

      padding:
        10px 18px !important;

      color:#d9e2dc !important;

      background:
        rgba(255,255,255,.025) !important;

      border:
        1px solid rgba(255,255,255,.12) !important;

      border-radius:11px !important;

      transition:
        transform .3s var(--ease),
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;
    }


    #semana-view
    .panel
    > div:last-child
    > button::before{

      content:"\f060";

      margin-right:9px;

      font-family:"Font Awesome 6 Free";
      font-weight:900;

      pointer-events:none;
    }


    #semana-view
    .panel
    > div:last-child
    > button:hover{

      transform:translateY(-3px);

      background:
        rgba(255,255,255,.055) !important;

      border-color:
        rgba(0,255,136,.3) !important;

      box-shadow:
        0 10px 22px rgba(0,0,0,.3);
    }


    /* =========================================================
       VISTA PREVIA MODAL
       ========================================================= */

    #preview-modal{

      position:fixed;

      inset:0;

      z-index:9999;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:
        20px;

      background:
        rgba(0,0,0,.78);

      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);

      opacity:0;

      visibility:hidden;

      pointer-events:none;

      transition:
        opacity .3s ease,
        visibility .3s ease;
    }


    #preview-modal.show{

      opacity:1;

      visibility:visible;

      pointer-events:auto;
    }


    .preview-window{

      position:relative;

      width:min(1100px,100%);

      height:min(88vh,850px);

      display:flex;

      flex-direction:column;

      overflow:hidden;

      background:
        linear-gradient(
          145deg,
          rgba(12,21,16,.98),
          rgba(3,7,5,.99)

      border:
        1px solid rgba(0,255,136,.2);

      border-radius:18px;

      box-shadow:
        0 35px 100px rgba(0,0,0,.75),
        0 0 45px rgba(0,255,136,.06),
        inset 0 1px 0 rgba(255,255,255,.05);

      transform:
        translateY(18px)
        scale(.97);

      transition:
        transform .35s var(--ease);
    }


    #preview-modal.show
    .preview-window{

      transform:
        translateY(0)
        scale(1);
    }


    .preview-header{

      flex:0 0 auto;

      min-height:64px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:15px;

      padding:
        12px 15px 12px 20px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        );

      border-bottom:
        1px solid rgba(0,255,136,.12);
    }


    .preview-title{

      min-width:0;

      display:flex;

      align-items:center;

      gap:10px;
    }


    .preview-title i{

      color:var(--accent);

      font-size:16px;

      filter:
        drop-shadow(
          0 0 7px rgba(0,255,136,.35)
        );
    }


    #preview-file-name{

      overflow:hidden;

      text-overflow:ellipsis;

      white-space:nowrap;

      color:#eaf3ed;

      font-size:13px;

      font-weight:600;
    }


    .preview-close{

      flex:0 0 auto;

      width:40px;
      height:40px;

      display:flex;

      align-items:center;
      justify-content:center;

      color:#b6c8bc;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:10px;

      cursor:pointer;

      transition:
        transform .3s var(--ease),
        color .3s ease,
        background .3s ease,
        border-color .3s ease;
    }


    .preview-close::before{

      content:"\f00d";

      font-family:"Font Awesome 6 Free";
      font-weight:900;

      pointer-events:none;
    }


    .preview-close:hover{

      color:#fff;

      background:
        rgba(255,70,70,.09);

      border-color:
        rgba(255,100,100,.25);

      transform:
        rotate(90deg)
        scale(1.04);
    }


    .preview-body{

      position:relative;

      flex:1;

      min-height:0;

      background:#111;
    }


    #preview-frame{

      display:block;

      width:100%;
      height:100%;

      border:0;

      background:#fff;
    }


    .preview-loading{

      position:absolute;

      inset:0;

      z-index:2;

      display:flex;

      align-items:center;
      justify-content:center;

      flex-direction:column;

      gap:12px;

      color:var(--accent);

      background:
        linear-gradient(
          145deg,
          #07100b,
          #030605
        );

      pointer-events:none;

      transition:
        opacity .3s ease;
    }


    .preview-loading.hidden{

      opacity:0;
    }


    .preview-loading i{

      font-size:25px;

      animation:
        spin 1s linear infinite;
    }


    @keyframes spin{

      to{
        transform:rotate(360deg);
      }
    }


    .preview-loading span{

      font-size:12px;

      color:var(--muted);
    }


    /* =========================================================
       LOGIN
       ========================================================= */

    #login .panel{

      width:min(520px,100%);

      margin:
        0 auto;

      padding:
        clamp(26px,5vw,42px);
    }


    #login .panel::after{

      width:280px;
      height:280px;

      right:-110px;
      bottom:-160px;

      top:auto;

      border:
        1px solid rgba(0,255,136,.09);

      background:
        radial-gradient(
          circle,
          rgba(0,255,136,.07),
          transparent 68%
        );
    }


    #login h2{

      margin-bottom:26px;
    }


    #login input{

      display:block;

      width:100%;
      max-width:none;

      height:50px;

      margin-bottom:14px;

      padding:
        12px 15px;

      color:#eef7f1;

      font-family:inherit;

      font-size:13px;

      background:
        linear-gradient(
          145deg,
          rgba(0,0,0,.48),
          rgba(255,255,255,.018)
        );

      border:
        1px solid rgba(255,255,255,.09);

      border-radius:11px;

      outline:none;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        0 5px 15px rgba(0,0,0,.18);

      transition:
        border-color .3s ease,
        box-shadow .3s ease,
        background .3s ease,
        transform .3s var(--ease);
    }


    #login input::placeholder{

      color:#6f8277;
    }


    #login input:hover{

      border-color:
        rgba(0,255,136,.18);
    }


    #login input:focus{

      border-color:
        rgba(0,255,136,.58);

      background:
        linear-gradient(
          145deg,
          rgba(0,255,136,.045),
          rgba(0,0,0,.38)
        );

      box-shadow:
        0 0 0 3px rgba(0,255,136,.08),
        0 0 22px rgba(0,255,136,.08),
        inset 0 1px 0 rgba(255,255,255,.04);

      transform:
        translateY(-1px);
    }


    #login button{

      position:relative;

      width:100%;

      min-height:50px;

      margin-top:5px;

      padding:
        12px 25px;

      color:#021108;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #00d975
        );

      border:
        1px solid rgba(255,255,255,.16);

      border-radius:11px;

      cursor:pointer;

      font-size:13px;

      font-weight:700;

      box-shadow:
        0 10px 24px rgba(0,255,136,.12),
        inset 0 1px 0 rgba(255,255,255,.38);

      transition:
        transform .3s var(--ease),
        box-shadow .3s ease,
        filter .3s ease;
    }


    #login button::before{

      content:"\f2f6";

      margin-right:9px;

      font-family:"Font Awesome 6 Free";
      font-weight:900;

      pointer-events:none;
    }


    #login button:hover{

      transform:translateY(-3px);

      filter:saturate(1.08);

      box-shadow:
        0 15px 30px rgba(0,0,0,.32),
        0 0 25px rgba(0,255,136,.18),
        inset 0 1px 0 rgba(255,255,255,.45);
    }


    #login button:active{

      transform:
        translateY(-1px)
        scale(.985);
    }


    #login-msg{

      min-height:24px;

      font-size:13px;

      font-weight:600;
    }


    /* =========================================================
       SCROLLBAR
       ========================================================= */

    ::-webkit-scrollbar{
      width:9px;
      height:9px;
    }


    ::-webkit-scrollbar-track{
      background:#030604;
    }


    ::-webkit-scrollbar-thumb{

      border-radius:20px;

      background:
        linear-gradient(
          180deg,
          rgba(0,255,136,.5),
          rgba(0,255,136,.18)
        );

      border:
        2px solid #030604;
    }


    ::-webkit-scrollbar-thumb:hover{

      background:var(--accent);
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width:900px){

      header{

        grid-template-columns:auto 1fr;

        gap:18px;
      }


      .header-center{

        text-align:left;
      }


      .header-center h1::after{

        margin-left:0;
        margin-right:0;
      }


      nav.header-nav{

        grid-column:
          1 / -1;

        justify-self:stretch;

        justify-content:center;
      }


      nav.header-nav a{

        flex:1;
      }


      .tasks-grid{

        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }


      #inicio .panel{

        grid-template-columns:1fr;

        min-height:270px;
      }


      #inicio .panel::after{

        width:240px;
        height:240px;

        right:-110px;

        opacity:.55;
      }


      #inicio h2,
      #inicio p{

        position:relative;

        z-index:2;
      }
    }


    /* =========================================================
       MOVIL
       ========================================================= */

    @media (max-width:600px){

      body::before{

        opacity:.16;

        background-size:40px 40px;
      }


      body::after{

        width:330px;
        height:330px;

        right:-180px;

        filter:blur(35px);
      }


      header{

        position:relative;

        grid-template-columns:1fr;

        justify-items:center;

        gap:13px;

        padding:
          17px 14px 14px;
      }


      .header-left img{

        height:58px;
      }


      .header-left::after{

        width:66px;
        height:66px;
      }


      .header-center{

        text-align:center;
      }


      .header-center h1{

        font-size:17px;

        letter-spacing:.09em;
      }


      .header-center h1::after{

        margin-left:auto;
        margin-right:auto;
      }


      .uni{

        font-size:11px;
      }


      .name{

        font-size:12px;
      }


      nav.header-nav{

        width:100%;

        padding:4px;
      }


      nav.header-nav a{

        min-width:0;

        padding:
          9px 7px;

        font-size:11px;
      }


      nav.header-nav a::before{

        font-size:10px;
      }


      main{

        padding:
          24px
          13px
          45px;
      }


      .panel{

        padding:
          22px 17px;

        border-radius:18px;

        backdrop-filter:blur(10px);
        -webkit-backdrop-filter:blur(10px);
      }


      h2{

        font-size:19px;
      }


      #inicio .panel{

        min-height:260px;

        display:block;

        padding:
          28px 21px;
      }


      #inicio .panel::after{

        width:190px;
        height:190px;

        right:-95px;

        top:58%;

        opacity:.38;
      }


      #inicio h2{

        font-size:28px;
      }


      #inicio p{

        font-size:13px;

        line-height:1.75;
      }


      .tasks-grid{

        grid-template-columns:1fr;

        gap:13px;
      }


      .task-card,
      #units .task-card,
      #weeks .task-card{

        min-height:145px;

        padding:

      }


      .task-icon{

        height:51px;
      }


      .task-icon i{

        font-size:21px;
      }


      #units .task-icon{

        width:55px;
        height:55px;
      }


      #units .task-icon i{

        font-size:24px;
      }


      .task-card:hover{

        transform:
          translateY(-4px)
          scale(1.008);
      }


      .file-item{

        grid-template-columns:1fr;

        gap:10px;

        padding:
          12px;
      }


      .file-actions{

        width:100%;
      }


      .preview-btn{

        width:100%;
      }


      .file-name{

        font-size:12px;
      }


      #semana-view
      .panel
      > div:last-child{

        flex-direction:column;

        align-items:stretch;
      }


      .repo-btn,
      #semana-view
      .panel
      > div:last-child
      > button{

        width:100%;

        margin-top:5px !important;
      }


      #login .panel{

        padding:
          25px 18px;
      }


      #preview-modal{

        padding:
          8px;
      }


      .preview-window{

        height:94vh;

        border-radius:14px;
      }


      .preview-header{

        min-height:58px;

        padding:
          10px 10px 10px 14px;
      }


      #preview-file-name{

        font-size:11px;
      }


      .preview-close{

        width:36px;
        height:36px;
      }
    }


    /* =========================================================
       REDUCIR ANIMACIONES
       ========================================================= */

    @media (prefers-reduced-motion:reduce){

      *,
      *::before,
      *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;

        transition-duration:.01ms !important;
      }
    }

  </style>

<body>

  <!-- =======================================================
       HEADER
       ======================================================= -->

  <header>

    <div class="header-left">

      <img
        src="upla.PNG"
        alt="Logo"
      >

    </div>


    <div class="header-center">

      <h1>
        BASE DE DATOS 2
      </h1>

      <div class="uni">
        Universidad Peruana Los Andes
      </div>

      <div class="name">
        Kevin Alfredo Macha Bruno
      </div>

    </div>


    <nav class="header-nav">

      <a onclick="showSection(event,'inicio')">
        Inicio
      </a>

      <a onclick="showSection(event,'tareas')">
        Tareas
      </a>

      <a onclick="showSection(event,'login')">
        Login
      </a>

    </nav>

  </header>


  <!-- =======================================================
       CONTENIDO PRINCIPAL
       ======================================================= -->

  <main>


    <!-- =====================================================
         INICIO
         ===================================================== -->

    <section
      id="inicio"
      class="section active"
    >

      <div class="panel">

        <h2>
          Bienvenido
        </h2>

        <p>
          Bienvenido al portal de
          <strong>Base de Datos 2</strong>.
        </p>

      </div>

    </section>


    <!-- =====================================================
         TAREAS
         ===================================================== -->

    <section
      id="tareas"
      class="section"
    >

      <div class="panel">

        <h2>
          Unidades
        </h2>

        <div
          class="tasks-grid"
          id="units"
        ></div>

      </div>

    </section>


    <!-- =====================================================
         SEMANAS
         ===================================================== -->

    <section
      id="weeks-view"
      class="section"
    >

      <div class="panel">

        <h2 id="unit-title"></h2>

        <div
          class="tasks-grid"
          id="weeks"
        ></div>


        <button
          onclick="showSection(event,'tareas')"
          style="
            margin-top:20px;
            background:transparent;
            border:1px solid var(--accent);
            color:var(--accent);
            padding:10px;
            cursor:pointer;
            border-radius:8px;
          "
        >
          Volver a Unidades
        </button>

      </div>

    </section>


    <!-- =====================================================
         ARCHIVOS
         ===================================================== -->

    <section
      id="semana-view"
      class="section"
    >

      <div class="panel">

        <h2>
          Archivos
        </h2>


        <div
          id="file-container"
          class="file-list"
        ></div>


        <div
          style="
            display:flex;
            gap:10px;
            align-items:center;
          "
        >

          <a
            id="repo-link"
            class="repo-btn"
            target="_blank"
          >
            Ir al repositorio
          </a>


          <button
            onclick="showSection(event,'weeks-view')"
            style="
              margin-top:14px;
              background:transparent;
              border:1px solid #555;
              color:#fff;
              padding:10px;
              cursor:pointer;
              border-radius:8px;
            "
          >
            Atrás
          </button>

        </div>

      </div>

    </section>


    <!-- =====================================================
         LOGIN
         ===================================================== -->

    <section
      id="login"
      class="section"
    >

      <div class="panel">

        <h2>
          Login
        </h2>


        <input
          id="user"
          placeholder="Usuario"
        >


        <input
          id="pass"
          type="password"
          placeholder="Contraseña"
        >


        <button onclick="login()">
          Ingresar
        </button>


        <p
          id="login-msg"
          style="margin-top:10px;"
        ></p>

      </div>

    </section>

  </main>


  <!-- =======================================================
       MODAL DE VISTA PREVIA
       ======================================================= -->

  <div
    id="preview-modal"
    aria-hidden="true"
  >

    <div class="preview-window">

      <div class="preview-header">

        <div class="preview-title">

          <i class="far fa-file-alt"></i>

          <span id="preview-file-name">
            Vista previa
          </span>

        </div>


        <button
          class="preview-close"
          onclick="closePreview()"
          aria-label="Cerrar vista previa"
          title="Cerrar"
        ></button>

      </div>


      <div class="preview-body">

        <div
          id="preview-loading"
          class="preview-loading"
        >

          <i class="fas fa-spinner"></i>

          <span>
            Cargando vista previa...
          </span>

        </div>


        <iframe
          id="preview-frame"
          title="Vista previa del archivo"
          loading="lazy"
        ></iframe>

      </div>

    </div>

  </div>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script>

    const weeksContainer =
      document.getElementById('weeks');

    const unitsContainer =
      document.getElementById('units');


    const repoUser =
      "KEVIN43287";

    const repoName =
      "Actividades";


    /* =====================================================
       CREAR UNIDADES
       ===================================================== */

    for(let u = 1; u <= 4; u++){

      const card =
        document.createElement('div');


      card.className =
        'task-card';


      card.innerHTML = `

        <div class="task-icon">

          <i class="fas fa-folder"></i>

        </div>

        <div class="task-label">

          Unidad ${u}

        </div>

      `;


      card.onclick =
        () => showWeeksOfUnit(u);


      unitsContainer.appendChild(card);

    }


    /* =====================================================
       MOSTRAR SEMANAS
       ===================================================== */

    function showWeeksOfUnit(unitNum){

      document.getElementById(
        'unit-title'
      ).textContent =
        "Semanas de la Unidad " +
        unitNum;


      weeksContainer.innerHTML =
        "";


      let start =
        (unitNum - 1) * 4 + 1;


      for(
        let i = start;
        i <= ((unitNum - 1) * 4 + 4);
        i++
      ){

        const card =
          document.createElement('div');


        card.className =
          'task-card';


        card.innerHTML = `

          <div class="task-icon">

            <i class="fas fa-database"></i>

          </div>

          <div class="task-num">

            ${String(i).padStart(2,'0')}

          </div>

          <div class="task-label">

            Semana ${i}

          </div>

        `;


        card.onclick =
          () => loadWeek(i);


        weeksContainer.appendChild(card);

      }


      showSection(
        null,
        'weeks-view'
      );

    }


    /* =====================================================
       CAMBIAR SECCION
       ===================================================== */

    function showSection(e,id){

      if(e){
        e.preventDefault();
      }


      const sections =
        document.querySelectorAll(
          '.section'
        );


      sections.forEach(sec => {

        sec.classList.remove(
          'active'
        );

        sec.style.display =
          'none';

      });


      const target =
        document.getElementById(id);


      if(target){

        target.style.display =
          'block';


        setTimeout(
          () =>
            target.classList.add(
              'active'
            ),
          10
        );

      }

    }


    /* =====================================================
       CARGAR SEMANA
       ===================================================== */

    async function loadWeek(num){

      const weekName =
        (num === 1)
          ? "Semana 1"
          : "Semana" + num;


      showSection(
        null,
        'semana-view'
      );


      const fileContainer =
        document.getElementById(
          'file-container'
        );


      const repoLink =
        document.getElementById(
          'repo-link'
        );


      repoLink.href =
        "https://github.com/" +
        repoUser +
        "/" +
        repoName +
        "/tree/main/" +
        encodeURIComponent(
          weekName
        );


      fileContainer.innerHTML = `

        <div class="loading-text">

          <i class="fas fa-spinner fa-spin"></i>

          Cargando archivos...

        </div>

      `;


      try{

        const res =
          await fetch(
            "https://api.github.com/repos/" +
            repoUser +
            "/" +
            repoName +
            "/contents/" +
            encodeURIComponent(
              weekName
            )
          );


        const data =
          await res.json();


        if(Array.isArray(data)){

          fileContainer.innerHTML =
            data.map(f => {

              const directUrl =
                f.download_url;


              const finalViewUrl =
                "https://docs.google.com/viewer?url=" +
                encodeURIComponent(
                  directUrl
                ) +
                "&embedded=true";


              const safeName =
                String(f.name)
                  .replace(
                    /&/g,
                    "&amp;"
                  )
                  .replace(
                    /"/g,
                    "&quot;"
                  )
                  .replace(
                    /</g,
                    "&lt;"
                  )
                  .replace(
                    />/g,
                    "&gt;"
                  );


              const safeUrl =
                String(finalViewUrl)
                  .replace(
                    /&/g,
                    "&amp;"
                  )
                  .replace(
                    /"/g,
                    "&quot;"
                  );


              return `

                <div class="file-item">

                  <div class="file-info">

                    <div class="file-icon">

                      <i class="far fa-file-alt"></i>

                    </div>


                    <div class="file-name">

                      <a
                        href="${safeUrl}"
                        target="_blank"
                        title="${safeName}"
                      >
                        ${safeName}
                      </a>

                    </div>

                  </div>


                  <div class="file-actions">

                    <button
                      class="preview-btn"
                      type="button"
                      data-url="${safeUrl}"
                      data-name="${safeName}"
                      onclick="openPreview(
                        this.dataset.url,
                        this.dataset.name
                      )"
                    >
                      Vista previa
                    </button>

                  </div>

                </div>

              `;

            }).join('');


        }else{

          fileContainer.innerHTML = `

            <div class="loading-text">

              No se encontraron archivos
              en la carpeta:
              ${weekName}

            </div>

          `;

        }


      }catch(error){

        fileContainer.innerHTML = `

          <div class="loading-text">

            <i class="fas fa-triangle-exclamation"></i>

            Error al conectar con el repositorio.

          </div>

        `;

      }

    }


    /* =====================================================
       ABRIR VISTA PREVIA
       ===================================================== */

    function openPreview(url,name){

      const modal =
        document.getElementById(
          'preview-modal'
        );


      const frame =
        document.getElementById(
          'preview-frame'
        );


      const title =
        document.getElementById(
          'preview-file-name'
        );


      const loading =
        document.getElementById(
          'preview-loading'
        );


      title.textContent =
        name || "Vista previa";


      loading.classList.remove(
        'hidden'
      );


      modal.classList.add(
        'show'
      );


      modal.setAttribute(
        'aria-hidden',
        'false'
      );


      document.body.style.overflow =
        'hidden';


      frame.onload =
        function(){

          loading.classList.add(
            'hidden'
          );

        };


      frame.src =
        url;

    }


    /* =====================================================
       CERRAR VISTA PREVIA
       ===================================================== */

    function closePreview(){

      const modal =
        document.getElementById(
          'preview-modal'
        );


      const frame =
        document.getElementById(
          'preview-frame'
        );


      const loading =
        document.getElementById(
          'preview-loading'
        );


      modal.classList.remove(
        'show'
      );


      modal.setAttribute(
        'aria-hidden',
        'true'
      );


      document.body.style.overflow =
        '';


      setTimeout(
        () => {

          frame.src =
            '';


          loading.classList.remove(
            'hidden'
          );

        },
        300
      );

    }


    /* =====================================================
       CERRAR CON ESC
       ===================================================== */

    document.addEventListener(
      'keydown',
      function(e){

        if(
          e.key === 'Escape'
        ){

          closePreview();

        }

      }
    );


    /* =====================================================
       CERRAR AL HACER CLICK
       EN EL FONDO DEL MODAL
       ===================================================== */

    document.getElementById(
      'preview-modal'
    ).addEventListener(
      'click',
      function(e){

        if(
          e.target === this
        ){

          closePreview();

        }

      }
    );


    /* =====================================================
       LOGIN
       ===================================================== */

    function login(){

      const user =
        document.getElementById(
          "user"
        ).value;


      const pass =
        document.getElementById(
          "pass"
        ).value;


      const msg =
        document.getElementById(
          "login-msg"
        );


      if(
        user === "kevin" &&
        pass === "123456"
      ){

        msg.style.color =
          "lime";


        msg.textContent =
          "Acceso correcto. ¡Hola Kevin!";

      }else{

        msg.style.color =
          "red";


        msg.textContent =
          "Usuario o contraseña incorrectos";

      }

    }

  </script>

</body>
</html>
