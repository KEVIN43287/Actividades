<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07100c">
  <title>BASE DE DATOS 2 - Inicio</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg:#030605;
      --bg-secondary:#07100c;
      --panel:rgba(10,18,14,.78);
      --panel-solid:#0b1510;
      --panel-hover:rgba(15,31,23,.92);

      --accent:#00ff88;
      --accent-soft:#56ffad;
      --accent-dark:#00c96b;

      --text:#f2f8f4;
      --text-secondary:#c1d0c7;
      --muted:#8fa69a;

      --border:rgba(0,255,136,.15);
      --border-strong:rgba(0,255,136,.38);

      --shadow:0 25px 70px rgba(0,0,0,.45);
      --glow:0 0 35px rgba(0,255,136,.12);

      --radius-lg:24px;
      --radius-md:16px;
      --radius-sm:12px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      min-height:100%;
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      font-family:"Inter","Poppins",Arial,sans-serif;
      color:var(--text);
      line-height:1.6;
      background:
        radial-gradient(circle at 50% -15%, rgba(0,255,136,.16), transparent 34%),
        radial-gradient(circle at 0% 50%, rgba(0,255,136,.055), transparent 28%),
        radial-gradient(circle at 100% 80%, rgba(0,255,136,.04), transparent 25%),
        linear-gradient(145deg,#020403 0%,#06100b 45%,#030605 100%);
      background-attachment:fixed;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      opacity:.22;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:45px 45px;
      mask-image:linear-gradient(to bottom,black,transparent 85%);
    }

    ::selection{
      background:rgba(0,255,136,.28);
      color:#fff;
    }

    ::-webkit-scrollbar{
      width:9px;
    }

    ::-webkit-scrollbar-track{
      background:#020403;
    }

    ::-webkit-scrollbar-thumb{
      background:rgba(0,255,136,.3);
      border-radius:20px;
      border:2px solid #020403;
    }

    ::-webkit-scrollbar-thumb:hover{
      background:var(--accent);
    }

    /* =========================
       HEADER
       ========================= */

    header{
      position:sticky;
      top:0;
      z-index:1000;

      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:28px;

      min-height:92px;
      padding:14px clamp(18px,4vw,54px);

      background:rgba(3,8,5,.76);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);

      border-bottom:1px solid rgba(0,255,136,.12);
      box-shadow:0 10px 35px rgba(0,0,0,.2);
    }

    header::after{
      content:"";
      position:absolute;
      bottom:-1px;
      left:8%;
      right:8%;
      height:1px;
      background:linear-gradient(
        90deg,
        transparent,
        rgba(0,255,136,.4),
        transparent
      );
    }

    .header-left{
      display:flex;
      align-items:center;
    }

    .header-left img{
      width:66px;
      height:66px;
      object-fit:contain;
      border-radius:16px;

      padding:5px;

      background:rgba(0,255,136,.045);
      border:1px solid rgba(0,255,136,.18);

      filter:
        drop-shadow(0 0 10px rgba(0,255,136,.22));

      transition:
        transform .35s ease,
        box-shadow .35s ease,
        border-color .35s ease;
    }

    .header-left img:hover{
      transform:translateY(-2px) scale(1.03);
      border-color:rgba(0,255,136,.45);
      box-shadow:0 10px 30px rgba(0,255,136,.12);
    }

    .header-center{
      text-align:center;
      min-width:0;
    }

    .header-center h1{
      margin:0;

      font-family:"Poppins",sans-serif;
      font-size:clamp(18px,2vw,25px);
      font-weight:800;
      letter-spacing:.12em;
      line-height:1.15;

      color:#fff;

      text-shadow:
        0 0 14px rgba(0,255,136,.35);

      animation:pulsado 3s ease-in-out infinite alternate;
    }

    @keyframes pulsado{
      from{
        text-shadow:0 0 8px rgba(0,255,136,.2);
      }
      to{
        text-shadow:
          0 0 15px rgba(0,255,136,.4),
          0 0 32px rgba(0,255,136,.12);
      }
    }

    .uni{
      margin-top:5px;
      font-size:12px;
      font-weight:500;
      color:var(--text-secondary);
      letter-spacing:.03em;
    }

    .name{
      margin-top:2px;
      font-size:12px;
      font-weight:700;
      color:var(--accent);
      letter-spacing:.04em;
    }

    /* =========================
       NAVEGACIÓN
       ========================= */

    nav.header-nav{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      padding:5px;

      border:1px solid rgba(255,255,255,.06);
      border-radius:15px;
      background:rgba(255,255,255,.025);
    }

    nav.header-nav a{
      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#b9c9c0;
      text-decoration:none;

      font-size:13px;
      font-weight:600;

      padding:10px 14px;
      border-radius:10px;

      border:1px solid transparent;

      transition:
        color .25s ease,
        background .25s ease,
        border-color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;

      cursor:pointer;
      white-space:nowrap;
    }

    nav.header-nav a::before{
      content:"";
      position:absolute;
      left:50%;
      bottom:5px;

      width:0;
      height:2px;

      border-radius:10px;
      background:var(--accent);

      transform:translateX(-50%);
      transition:width .25s ease;
    }

    nav.header-nav a:hover{
      color:#fff;
      background:rgba(0,255,136,.075);
      border-color:rgba(0,255,136,.13);
      box-shadow:0 7px 20px rgba(0,0,0,.15);
      transform:translateY(-1px);
    }

    nav.header-nav a:hover::before{
      width:22px;
    }

    /* =========================
       CONTENIDO
       ========================= */

    main{
      width:min(1160px,100%);
      margin:0 auto;
      padding:
        clamp(32px,6vw,72px)
        clamp(16px,4vw,30px)
        90px;
    }

    .section{
      display:none;
      opacity:0;
    }

    .section.active{
      display:block;
      opacity:1;
      animation:sectionEnter .45s ease forwards;
    }

    @keyframes sectionEnter{
      from{
        opacity:0;
        transform:translateY(12px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* =========================
       PANEL
       ========================= */

    .panel{
      position:relative;
      overflow:hidden;

      padding:clamp(24px,4vw,38px);

      border:1px solid var(--border);
      border-radius:var(--radius-lg);

      background:
        linear-gradient(
          145deg,
          rgba(16,30,22,.88),
          rgba(6,13,9,.86)
        );

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      box-shadow:
        var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.025);

      animation:slideUp .55s ease;
    }

    .panel::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:1px;

      background:linear-gradient(
        90deg,
        transparent,
        rgba(0,255,136,.5),
        transparent
      );
    }

    .panel::after{
      content:"";
      position:absolute;
      width:260px;
      height:260px;
      top:-170px;
      right:-120px;

      border-radius:50%;

      background:rgba(0,255,136,.055);
      filter:blur(30px);

      pointer-events:none;
    }

    @keyframes slideUp{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h2{
      position:relative;
      z-index:1;

      display:flex;
      align-items:center;
      gap:12px;

      margin:0 0 18px;

      font-family:"Poppins",sans-serif;
      font-size:clamp(20px,3vw,28px);
      font-weight:700;
      letter-spacing:-.025em;

      color:#fff;
    }

    h2::before{
      content:"";
      width:4px;
      height:28px;

      flex:none;

      border-radius:10px;
      background:var(--accent);

      box-shadow:
        0 0 15px rgba(0,255,136,.55);
    }

    .panel > p{
      position:relative;
      z-index:1;

      color:var(--text-secondary);
      font-size:15px;
    }

    .panel > p strong{
      color:#fff;
    }

    /* =========================
       INICIO
    #inicio .panel{
      min-height:300px;

      display:flex;
      flex-direction:column;
      justify-content:center;

      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(0,255,136,.09),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          rgba(12,30,21,.92),
          rgba(5,12,8,.94)
        );
    }

    #inicio .panel h2{
      font-size:clamp(30px,5vw,48px);
      margin-bottom:12px;
    }

    #inicio .panel h2::before{
      height:42px;
    }

    #inicio .panel > p{
      max-width:680px;
      font-size:clamp(15px,2vw,18px);
      line-height:1.8;
    }

    /* =========================
       TARJETAS
       ========================= */

    .tasks-grid{
      position:relative;
      z-index:1;

      margin-top:24px;

      display:grid;
      grid-template-columns:
        repeat(auto-fit,minmax(min(210px,100%),1fr));

      gap:18px;
    }

    .task-card{
      position:relative;
      overflow:hidden;

      min-height:145px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      gap:9px;

      text-align:center;

      padding:24px 18px;

      border-radius:var(--radius-md);
      border:1px solid rgba(0,255,136,.12);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.012)
        );

      cursor:pointer;

      transition:
        transform .3s cubic-bezier(.2,.8,.2,1),
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;
    }

    .task-card::before{
      content:"";
      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0,255,136,.1),
          transparent 55%
        );

      opacity:0;
      transition:opacity .3s ease;
      pointer-events:none;
    }

    .task-card::after{
      content:"";
      position:absolute;

      left:18%;
      right:18%;
      bottom:-2px;

      height:2px;

      background:var(--accent);
      box-shadow:0 0 15px rgba(0,255,136,.55);

      transform:scaleX(0);
      transform-origin:center;

      transition:transform .3s ease;
    }

    .task-card:hover{
      border-color:rgba(0,255,136,.4);

      background:
        linear-gradient(
          145deg,
          rgba(0,255,136,.075),
          rgba(255,255,255,.025)
        );

      box-shadow:
        0 18px 45px rgba(0,0,0,.32),
        0 0 25px rgba(0,255,136,.08);

      transform:translateY(-6px);
    }

    .task-card:hover::before{
      opacity:1;
    }

    .task-card:hover::after{
      transform:scaleX(1);
    }

    .task-icon{
      position:relative;
      z-index:1;

      width:54px;
      height:54px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:15px;

      background:rgba(0,255,136,.07);
      border:1px solid rgba(0,255,136,.16);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035);

      transition:
        transform .3s ease,
        background .3s ease,
        box-shadow .3s ease;
    }

    .task-icon i{
      font-size:21px;
      color:var(--accent);

      filter:drop-shadow(0 0 7px rgba(0,255,136,.25));

      transition:transform .3s ease;
    }

    .task-card:hover .task-icon{
      background:rgba(0,255,136,.12);
      box-shadow:0 0 22px rgba(0,255,136,.12);
      transform:translateY(-2px);
    }

    .task-card:hover .task-icon i{
      transform:scale(1.08);
    }

    .task-label{
      position:relative;
      z-index:1;

      font-size:14px;
      font-weight:700;
      color:#eef7f1;
    }

    .task-num{
      position:relative;
      z-index:1;

      font-size:11px;
      font-weight:700;
      letter-spacing:.18em;

      color:var(--accent);
      opacity:.8;
    }

    /* =========================
       ARCHIVOS
       ========================= */

    .file-list{
      position:relative;
      z-index:1;

      display:flex;
      flex-direction:column;
      gap:10px;

      margin-top:20px;
    }

    .file-list > div{
      width:100%;
    }

    .file-list a{
      position:relative;

      display:flex;
      align-items:center;
      gap:13px;

      width:100%;

      color:var(--text-secondary);
      text-decoration:none;

      margin:0;

      padding:14px 17px;

      border-radius:13px;

      background:rgba(255,255,255,.025);
      border:1px solid rgba(255,255,255,.06);

      transition:
        color .25s ease,
        background .25s ease,
        border-color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
    }

    .file-list a i{
      width:34px;
      height:34px;

      display:flex;
      align-items:center;
      justify-content:center;

      flex:none;

      border-radius:9px;

      color:var(--accent);
      background:rgba(0,255,136,.07);
      border:1px solid rgba(0,255,136,.1);

      transition:
        background .25s ease,
        transform .25s ease;
    }

    .file-list a:hover{
      color:#fff;
      background:rgba(0,255,136,.055);
      border-color:rgba(0,255,136,.28);

      transform:translateX(5px);

      box-shadow:
        -4px 0 0 rgba(0,255,136,.55),
        0 10px 25px rgba(0,0,0,.18);
    }

    .file-list a:hover i{
      background:rgba(0,255,136,.14);
      transform:scale(1.05);
    }

    /* =========================
       CARGANDO
       ========================= */

    .loading-text{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      min-height:90px;

      color:var(--accent);
      font-size:14px;
      font-weight:600;

      border:1px dashed rgba(0,255,136,.18);
      border-radius:14px;
      background:rgba(0,255,136,.025);

      animation:pulseLoading 1.5s infinite ease-in-out;
    }

    .loading-text i{
      font-size:16px;
    }

    @keyframes pulseLoading{
      0%{
        opacity:.55;
      }
      50%{
        opacity:1;
        box-shadow:0 0 22px rgba(0,255,136,.07);
      }
      100%{
        opacity:.55;
      }
    }

    /* =========================
       BOTONES
       ========================= */

    .repo-btn{
      margin-top:20px;

      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;

      min-height:46px;

      padding:0 20px;

      background:linear-gradient(
        135deg,
        var(--accent),
        #00d978
      );

      color:#021108;

      border:1px solid rgba(0,255,136,.7);
      border-radius:12px;

      text-decoration:none;

      font-size:13px;
      font-weight:800;
      letter-spacing:.01em;

      box-shadow:
        0 8px 25px rgba(0,255,136,.1);

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
    }

    .repo-btn::before{
      content:"\f09b";
      font-family:"Font Awesome 6 Brands";
      font-weight:400;
    }

    .repo-btn:hover{
      transform:translateY(-3px);
      filter:brightness(1.08);

      box-shadow:
        0 12px 30px rgba(0,255,136,.2),
        0 0 22px rgba(0,255,136,.14);
    }

    .repo-btn:active{
      transform:translateY(0);
    }

    button{
      font-family:inherit;
    }

    #weeks-view button,
    #semana-view button{
      min-height:46px;

      padding:0 17px !important;

      border-radius:12px !important;

      font-size:13px;
      font-weight:700;

      transition:
        background .25s ease,
        border-color .25s ease,
        color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
    }

    #weeks-view button:hover{
      background:rgba(0,255,136,.08) !important;
      border-color:var(--accent) !important;
      box-shadow:0 8px 25px rgba(0,255,136,.08);
      transform:translateY(-2px);
    }

    #semana-view button:hover{
      background:rgba(255,255,255,.07) !important;
      border-color:rgba(255,255,255,.25) !important;
      transform:translateY(-2px);
    }

    /* =========================
       LOGIN
       ========================= */

    #login .panel{
      max-width:620px;
      margin:0 auto;
    }

    #login input{
      display:block;

      width:100%;
      max-width:430px;

      min-height:50px;

      margin-bottom:14px;

      padding:0 16px;

      background:rgba(0,0,0,.35);

      border:1px solid rgba(255,255,255,.09);
      border-radius:12px;

      color:#fff;

      font-family:inherit;
      font-size:14px;

      outline:none;

      transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease,
        transform .25s ease;
    }

    #login input::placeholder{
      color:#6f8277;
    }

    #login input:focus{
      background:rgba(0,255,136,.025);
      border-color:rgba(0,255,136,.55);

      box-shadow:
        0 0 0 3px rgba(0,255,136,.06),
        0 0 22px rgba(0,255,136,.08);

      transform:translateY(-1px);
    }

    #login button{
      min-height:48px;

      padding:0 26px;

      background:linear-gradient(
        135deg,
        var(--accent),
        #00d978
      );

      color:#021108;

      border:1px solid rgba(0,255,136,.65);
      border-radius:12px;

      cursor:pointer;

      font-size:13px;
      font-weight:800;

      box-shadow:0 8px 25px rgba(0,255,136,.09);

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
    }

    #login button:hover{
      filter:brightness(1.08);
      transform:translateY(-2px);

      box-shadow:
        0 12px 30px rgba(0,255,136,.18),
        0 0 20px rgba(0,255,136,.1);
    }

    #login button:active{
      transform:translateY(0);
    }

    #login-msg{
      min-height:24px;
      font-size:13px;
      font-weight:600;
    }

    /* =========================
       FOCUS ACCESIBLE
       ========================= */

    a:focus-visible,
    button:focus-visible,
    input:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:3px;
    }

    /* =========================
       RESPONSIVE TABLET
       ========================= */

    @media (max-width:850px){

      header{
        grid-template-columns:auto 1fr;
        gap:14px 18px;
      }

      .header-center{
        text-align:left;
      }

      nav.header-nav{
        grid-column:1 / -1;
        width:100%;
        justify-content:center;
      }

      nav.header-nav a{
        flex:1;
        max-width:180px;
      }

      main{
        padding-top:35px;
      }
    }

    /* =========================
       RESPONSIVE CELULAR
       ========================= */

    @media (max-width:600px){

      header{
        position:relative;

        grid-template-columns:auto 1fr;

        padding:13px 15px 12px;

        gap:12px;
      }

      .header-left img{
        width:54px;
        height:54px;
        border-radius:13px;
      }

      .header-center h1{
        font-size:16px;
        letter-spacing:.07em;
      }

      .uni{
        font-size:10px;
        line-height:1.35;
      }

      .name{
        font-size:10px;
      }

      nav.header-nav{
        gap:4px;
        padding:4px;
        border-radius:12px;
      }

      nav.header-nav a{
        padding:9px 7px;
        font-size:11px;
        border-radius:9px;
      }

      main{
        padding:
          24px 13px
          55px;
      }

      .panel{
        padding:22px 17px;
        border-radius:19px;
      }

      h2{
        font-size:21px;
      }

      h2::before{
        height:23px;
      }

      #inicio .panel{
        min-height:270px;
      }

      #inicio .panel h2{
        font-size:30px;
      }

      #inicio .panel h2::before{
        height:34px;
      }

      #inicio .panel > p{
        font-size:14px;
      }

      .tasks-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:11px;
      }

      .task-card{
        min-height:135px;
        padding:18px 10px;
        border-radius:14px;
      }

      .task-icon{
        width:48px;
        height:48px;
        border-radius:13px;
      }

      .task-icon i{
        font-size:19px;
      }

      .task-label{
        font-size:12px;
      }

      .task-num{
        font-size:10px;
      }

      .file-list a{
        padding:12px;
        font-size:12px;
      }

      .file-list a i{
        width:31px;
        height:31px;
      }

      #weeks-view > .panel > button,
      #semana-view > .panel > div:last-child{
        width:100%;
      }

      #semana-view > .panel > div:last-child{
        display:flex !important;
        flex-direction:column;
        align-items:stretch !important;
        gap:9px !important;
      }

      #semana-view .repo-btn,
      #semana-view button{
        width:100%;
        margin-top:0 !important;
      }

      #login input{
        max-width:none;
      }

      #login button{
        width:100%;
      }
    }

    /* =========================
       CELULARES MUY PEQUEÑOS
       ========================= */

    @media (max-width:370px){

      .header-center h1{
        font-size:14px;
      }

      .uni{
        font-size:9px;
      }

      .name{
        font-size:9px;
      }

      nav.header-nav a{
        font-size:10px;
        padding:8px 4px;
      }

      .tasks-grid{
        grid-template-columns:1fr;
      }

      .task-card{
        min-height:120px;
      }
    }

    /* =========================
       REDUCCIÓN DE MOVIMIENTO
       ========================= */
    @media (prefers-reduced-motion:reduce){

      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-left">
    <img src="upla.PNG" alt="Logo">
  </div>

  <div class="header-center">
    <h1>BASE DE DATOS 2</h1>
    <div class="uni">Universidad Peruana Los Andes</div>
    <div class="name">Kevin Alfredo Macha Bruno</div>
  </div>

  <nav class="header-nav">
    <a onclick="showSection(event,'inicio')">Inicio</a>
    <a onclick="showSection(event,'tareas')">Tareas</a>
    <a onclick="showSection(event,'login')">Login</a>
  </nav>

</header>

<main>

  <section id="inicio" class="section active">

    <div class="panel">

      <h2>Bienvenido</h2>

      <p>
        Bienvenido al portal de
        <strong>Base de Datos 2</strong>.
      </p>

    </div>

  </section>


  <section id="tareas" class="section">

    <div class="panel">

      <h2>Unidades</h2>

      <div class="tasks-grid" id="units"></div>

    </div>

  </section>


  <section id="weeks-view" class="section">

    <div class="panel">

      <h2 id="unit-title"></h2>

      <div class="tasks-grid" id="weeks"></div>

      <button
        onclick="showSection(event,'tareas')"
        style="margin-top:20px; background:transparent; border:1px solid var(--accent); color:var(--accent); padding:10px; cursor:pointer; border-radius:8px;"
      >
        <i class="fas fa-arrow-left"></i>
        &nbsp; Volver a Unidades
      </button>

    </div>

  </section>


  <section id="semana-view" class="section">

    <div class="panel">

      <h2>Archivos</h2>

      <div id="file-container" class="file-list"></div>

      <div style="display:flex; gap:10px; align-items:center;">

        <a
          id="repo-link"
          class="repo-btn"
          target="_blank"
        >
          Ir al repositorio
        </a>

        <button
          onclick="showSection(event,'weeks-view')"
          style="margin-top:14px; background:transparent; border:1px solid #555; color:#fff; padding:10px; cursor:pointer; border-radius:8px;"
        >
          <i class="fas fa-arrow-left"></i>
          &nbsp; Atrás
        </button>

      </div>

    </div>

  </section>


  <section id="login" class="section">

    <div class="panel">

      <h2>Login</h2>

      <input
        id="user"
        placeholder="Usuario"
        autocomplete="username"
      >

      <input
        id="pass"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
      >

      <button onclick="login()">
        <i class="fas fa-right-to-bracket"></i>
        &nbsp; Ingresar
      </button>

      <p id="login-msg" style="margin-top:10px;"></p>

    </div>

  </section>

</main>


<script>

  const weeksContainer = document.getElementById('weeks');
  const unitsContainer = document.getElementById('units');

  const repoUser = "KEVIN43287";
  const repoName = "Actividades";


  for (let u = 1; u <= 4; u++) {

    const card = document.createElement('div');

    card.className = 'task-card';

    card.innerHTML = `
      <div class="task-icon">
        <i class="fas fa-folder"></i>
      </div>

      <div class="task-label">
        Unidad ${u}
      </div>
    `;

    card.onclick = () => showWeeksOfUnit(u);

    unitsContainer.appendChild(card);
  }


  function showWeeksOfUnit(unitNum) {

    document.getElementById('unit-title').textContent =
      "Semanas de la Unidad " + unitNum;

    weeksContainer.innerHTML = "";

    let start = (unitNum - 1) * 4 + 1;

    for (
      let i = start;
      i <= ((unitNum - 1) * 4 + 4);
      i++
    ) {

      const card = document.createElement('div');

      card.className = 'task-card';

      card.innerHTML = `
        <div class="task-icon">
          <i class="fas fa-database"></i>
        </div>

        <div class="task-num">
          ${String(i).padStart(2,'0')}
        </div>

        <div class="task-label">
          Semana ${i}
        </div>
      `;

      card.onclick = () => loadWeek(i);

      weeksContainer.appendChild(card);
    }

    showSection(null, 'weeks-view');
  }


  function showSection(e, id) {

    if (e) e.preventDefault();

    const sections = document.querySelectorAll('.section');

    sections.forEach(sec => {

      sec.classList.remove('active');
      sec.style.display = 'none';

    });

    const target = document.getElementById(id);

    if (target) {

      target.style.display = 'block';

      setTimeout(() => target.classList.add('active'), 10);

    }
  }


  async function loadWeek(num) {

    const weekName =
      (num === 1)
        ? "Semana 1"
        : "Semana" + num;

    showSection(null, 'semana-view');

    const fileContainer =
      document.getElementById('file-container');

    const repoLink =
      document.getElementById('repo-link');

    repoLink.href =
      "https://github.com/" +
      repoUser +
      "/" +
      repoName +
      "/tree/main/" +
      encodeURIComponent(weekName);


    fileContainer.innerHTML =
      "<div class='loading-text'>" +
      "<i class='fas fa-spinner fa-spin'></i> " +
      "Cargando archivos..." +
      "</div>";


    try {

      const res = await fetch(
        "https://api.github.com/repos/" +
        repoUser +
        "/" +
        repoName +
        "/contents/" +
        encodeURIComponent(weekName)
      );

      const data = await res.json();


      if (Array.isArray(data)) {

        fileContainer.innerHTML = data.map(f => {

          const directUrl = f.download_url;

          const finalViewUrl =
            "https://docs.google.com/viewer?url=" +
            encodeURIComponent(directUrl) +
            "&embedded=true";

          return `
            <div>
              <a href="${finalViewUrl}" target="_blank">
                <i class="far fa-file-alt"></i>
                ${f.name}
              </a>
            </div>
          `;

        }).join('');

      } else {

        fileContainer.innerHTML =
          "No se encontraron archivos en la carpeta: " +
          weekName;

      }

    } catch (error) {

      fileContainer.innerHTML =
        "Error al conectar con el repositorio.";

    }

  }


  function login() {

    const user =
      document.getElementById("user").value;

    const pass =
      document.getElementById("pass").value;

    const msg =
      document.getElementById("login-msg");


    if (
      user === "kevin" &&
      pass === "123456"
    ) {

      msg.style.color = "lime";

      msg.textContent =
        "Acceso correcto. ¡Hola Kevin!";

    } else {

      msg.style.color = "red";

      msg.textContent =
        "Usuario o contraseña incorrectos";

    }

  }

</script>

</body>
</html>
